    </header>
    <section id="overview" style="padding: 52px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 18px">
    <span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: var(--accent)">01 · OVERVIEW</span><h2 style="margin: 0; font-size: clamp(28px, 3.4vw, 44px); font-weight: 600; letter-spacing: -0.03em; line-height: 1.08">A helpdesk in every technician’s pocket.</h2>
    <div style="display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; background: rgba(var(--accent-rgb),0.08); border: 1px solid rgba(var(--accent-rgb),0.25)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; color: var(--accent); padding-top: 3px; white-space: nowrap">KEY TAKEAWAY</span><span style="font-size: 16px; font-weight: 600; line-height: 1.45">A field-service helpdesk for TTD, redesigned around who is holding the phone.</span></div>

display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.06em; color: var(--muted)">PLATFORM</span><span style="font-size: 15px; font-weight: 600">Android &amp; iOS</span></div></div><p style="margin: 0; font-size: 17px; line-height: 1.6; color: var(--ink-2)">Nandakam is the mobile app TTD’s facility teams use to raise, work on and track maintenance requests across their blocks, from electrical faults to leaking pipes, alongside daily inspections. This project redesigned its helpdesk for three very different roles.</p><div style="padding: 20px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); "><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.06em; color: var(--accent)">MY RESPONSIBILITIES</span><div style="height: 10px"></div><ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px"><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>Mapped each role’s data logic from the functional spec</span></li><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>Designed the role-based home, lists, filters and create flow</span></li><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>Designed escalation and notification touchpoints</span></li><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>Prototyped, handed off and ran design QA</span></li></ul></div></section><section id="problem" style="padding: 52px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 18px">
    <span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: var(--accent)">02 · PROBLEM</span><h2 style="margin: 0; font-size: clamp(28px, 3.4vw, 44px); font-weight: 600; letter-spacing: -0.03em; line-height: 1.08">Everyone saw the same long request list, so nobody could tell what needed them first.</h2>
    <div style="display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; background: rgba(var(--accent-rgb),0.08); border: 1px solid rgba(var(--accent-rgb),0.25)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; color: var(--accent); padding-top: 3px; white-space: nowrap">KEY TAKEAWAY</span><span style="font-size: 16px; font-weight: 600; line-height: 1.45">The data was there. The priorities weren’t.</span></div>
    <blockquote style="margin: 0; padding: 20px 24px; border-left: 4px solid var(--pain); background: var(--pain-bg); border-radius: 0 16px 16px 0; font-size: 20px; line-height: 1.5">A technician needs their own jobs. A supervisor needs what’s been escalated to their level. A TTD official needs the whole picture across every block. One undifferentiated list served none of them, and escalations, which climb through six levels, were easy to miss.</blockquote><p style="margin: 0; font-size: 17px; line-height: 1.6; color: var(--ink-2)">When a request sits unnoticed, its SLA breaches and it escalates further up the chain, more noise for officials, and slower fixes on the ground.</p><div style="display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; align-items: flex-start; padding: 28px 18px; border-radius: 20px; background: var(--pain-bg)"><div style="width: 260px; max-width: 100%; height: 440px; border-radius: 30px; border: 7px solid #1F2125; background: #F6F7F8; overflow: hidden; box-shadow: 0 30px 60px -28px rgba(0,0,0,0.55); font-family: 'Inter', 'Helvetica Neue', Helvetica, sans-serif; color: #1C1D21; font-size: 12px; display: flex; flex-direction: column; "><div style="background: #00796B; color: #FFF"><div style="display: flex; justify-content: space-between; padding: 6px 14px 0; font-size: 10px; font-weight: 600"><span>9:41</span><span>●●● ▮</span></div><div style="display: flex; align-items: center; gap: 10px; padding: 10px 14px 12px"><span>‹</span><b style="flex: 1; text-align: center; font-size: 14px">All Requests</b><span style="width: 8px"></span></div></div><div style="flex: 1; min-height: 0; overflow: hidden; position: relative"><div style="padding: 10px; display: flex; flex-direction: column; gap: 6px"><div style="padding: 9px 10px; border-radius: 8px; background: #FFF; border: 1px solid #E7E9EC; "><div style="display: flex; justify-content: space-between"><b style="font-size: 12px">REQ-2024-1997</b><span style="font-size: 9px; color: #6B6E76">12 May · 09:12 AM</span></div><div style="font-size: 11px; font-weight: 600; color: #333">AVRH • East Wing</div><div style="font-size: 11px; color: #6B6E76">Electrical short circuit in room 204</div></div><div style="padding: 9px 10px; border-radius: 8px; background: #FFF; border: 1px solid #E7E9EC; "><div style="display: flex; justify-content: space-between"><b style="font-size: 12px">REQ-2024-1998</b><span style="font-size: 9px; color: #6B6E76">12 May · 09:12 AM</span></div><div style="font-size: 11px; font-weight: 600; color: #333">MNTC • West Wing</div><div style="font-size: 11px; color: #6B6E76">HVAC malfunction on 3rd floor</div></div><div style="padding: 9px 10px; border-radius: 8px; background: #FFF; border: 1px solid #E7E9EC; "><div style="display: flex; justify-content: space-between"><b style="font-size: 12px">REQ-2024-1999</b><span style="font-size: 9px; color: #6B6E76">12 May · 09:12 AM</span></div><div style="font-size: 11px; font-weight: 600; color: #333">PLMB • Basement</div><div style="font-size: 11px; color: #6B6E76">Leaking pipe near water heater</div></div><div style="padding: 9px 10px; border-radius: 8px; background: #FFF; border: 1px solid #E7E9EC; "><div style="display: flex; justify-content: space-between"><b style="font-size: 12px">REQ-2024-1997</b><span style="font-size: 9px; color: #6B6E76">12 May · 09:12 AM</span></div><div style="font-size: 11px; font-weight: 600; color: #333">AVRH • East Wing</div><div style="font-size: 11px; color: #6B6E76">Electrical short circuit in room 204</div></div><div style="padding: 9px 10px; border-radius: 8px; background: #FFF; border: 1px solid #E7E9EC; "><div style="display: flex; justify-content: space-between"><b style="font-size: 12px">REQ-2024-1998</b><span style="font-size: 9px; color: #6B6E76">12 May · 09:12 AM</span></div><div style="font-size: 11px; font-weight: 600; color: #333">MNTC • West Wing</div><div style="font-size: 11px; color: #6B6E76">HVAC malfunction on 3rd floor</div></div><div style="padding: 9px 10px; border-radius: 8px; background: #FFF; border: 1px solid #E7E9EC; "><div style="display: flex; justify-content: space-between"><b style="font-size: 12px">REQ-2024-1999</b><span style="font-size: 9px; color: #6B6E76">12 May · 09:12 AM</span></div><div style="font-size: 11px; font-weight: 600; color: #333">PLMB • Basement</div><div style="font-size: 11px; color: #6B6E76">Leaking pipe near water heater</div></div></div></div></div></div></section><section id="pains" style="padding: 52px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 18px">
    <span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: var(--accent)">03 · PAIN POINTS</span><h2 style="margin: 0; font-size: clamp(28px, 3.4vw, 44px); font-weight: 600; letter-spacing: -0.03em; line-height: 1.08">Six frustrations from the field.</h2>
    <div style="display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; background: rgba(var(--accent-rgb),0.08); border: 1px solid rgba(var(--accent-rgb),0.25)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; color: var(--accent); padding-top: 3px; white-space: nowrap">KEY TAKEAWAY</span><span style="font-size: 16px; font-weight: 600; line-height: 1.45">Six pains, most of them about not knowing what comes first.</span></div>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px"><div style="display: flex; gap: 14px; padding: 16px 18px; border-radius: 16px; background: var(--pain-bg); border: 1px solid color-mix(in srgb, var(--pain) 35%, transparent)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; color: var(--pain); font-weight: 700">P1</span><span style="display: flex; flex-direction: column; gap: 4px"><b style="font-size: 16px">One list for three different jobs</b><span style="font-size: 14px; line-height: 1.5; color: var(--ink-2)">Technicians, supervisors and officials all landed on the same generic list.</span></span></div><div style="display: flex; gap: 14px; padding: 16px 18px; border-radius: 16px; background: var(--pain-bg); border: 1px solid color-mix(in srgb, var(--pain) 35%, transparent)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; color: var(--pain); font-weight: 700">P2</span><span style="display: flex; flex-direction: column; gap: 4px"><b style="font-size: 16px">Escalations were easy to miss</b><span style="font-size: 14px; line-height: 1.5; color: var(--ink-2)">Requests climb from L2 to L6 with no clear place to see them first.</span></span></div><div style="display: flex; gap: 14px; padding: 16px 18px; border-radius: 16px; background: var(--pain-bg); border: 1px solid color-mix(in srgb, var(--pain) 35%, transparent)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; color: var(--pain); font-weight: 700">P3</span><span style="display: flex; flex-direction: column; gap: 4px"><b style="font-size: 16px">No view by block</b><span style="font-size: 14px; line-height: 1.5; color: var(--ink-2)">Officials couldn’t see which buildings had the most open or escalated work.</span></span></div><div style="display: flex; gap: 14px; padding: 16px 18px; border-radius: 16px; background: var(--pain-bg); border: 1px solid color-mix(in srgb, var(--pain) 35%, transparent)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; color: var(--pain); font-weight: 700">P4</span><span style="display: flex; flex-direction: column; gap: 4px"><b style="font-size: 16px">Slow, cluttered request creation</b><span style="font-size: 14px; line-height: 1.5; color: var(--ink-2)">Extra fields slowed field staff raising issues on the move.</span></span></div><div style="display: flex; gap: 14px; padding: 16px 18px; border-radius: 16px; background: var(--pain-bg); border: 1px solid color-mix(in srgb, var(--pain) 35%, transparent)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; color: var(--pain); font-weight: 700">P5</span><span style="display: flex; flex-direction: column; gap: 4px"><b style="font-size: 16px">Text-only evidence</b><span style="font-size: 14px; line-height: 1.5; color: var(--ink-2)">No video or audio to show the actual problem, or the fix.</span></span></div><div style="display: flex; gap: 14px; padding: 16px 18px; border-radius: 16px; background: var(--pain-bg); border: 1px solid color-mix(in srgb, var(--pain) 35%, transparent)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; color: var(--pain); font-weight: 700">P6</span><span style="display: flex; flex-direction: column; gap: 4px"><b style="font-size: 16px">Shared logins</b><span style="font-size: 14px; line-height: 1.5; color: var(--ink-2)">The same account could stay active on several devices.</span></span></div></div></section><section id="goals" style="padding: 52px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 18px">
    <span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: var(--accent)">04 · GOALS</span><h2 style="margin: 0; font-size: clamp(28px, 3.4vw, 44px); font-weight: 600; letter-spacing: -0.03em; line-height: 1.08">What success looks like.</h2>
    <div style="display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; background: rgba(var(--accent-rgb),0.08); border: 1px solid rgba(var(--accent-rgb),0.25)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; color: var(--accent); padding-top: 3px; white-space: nowrap">KEY TAKEAWAY</span><span style="font-size: 16px; font-weight: 600; line-height: 1.45">Success = the right request, to the right person, before it escalates.</span></div>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px"><div style="padding: 20px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); "><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.06em; color: var(--accent)">USER GOALS</span><div style="height: 10px"></div><ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px"><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>See my most urgent requests at a glance</span></li><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>Raise a request in under a minute, on site</span></li><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>Show proof with photo, video or voice</span></li></ul></div><div style="padding: 20px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); "><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.06em; color: var(--accent)">BUSINESS GOALS</span><div style="height: 10px"></div><ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px"><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>Fewer SLA breaches and late escalations</span></li><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>Block-level visibility for TTD officials</span></li><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>Secure, accountable single-device access</span></li></ul></div></div><div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px"><div style="padding: 18px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line)"><div style="font-size: 34px; font-weight: 700; letter-spacing: -0.03em; color: var(--accent)">30%</div><div style="margin-top: 4px; font-size: 14px; color: var(--ink-2)">fewer SLA breaches (target)</div></div><div style="padding: 18px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line)"><div style="font-size: 34px; font-weight: 700; letter-spacing: -0.03em; color: var(--accent)">&lt; 1 min</div><div style="margin-top: 4px; font-size: 14px; color: var(--ink-2)">to raise a request on site (target)</div></div><div style="padding: 18px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line)"><div style="font-size: 34px; font-weight: 700; letter-spacing: -0.03em; color: var(--accent)">60%</div><div style="margin-top: 4px; font-size: 14px; color: var(--ink-2)">of requests resolved before L2 (target)</div></div></div></section><section id="stories" style="padding: 52px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 18px">
    <span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: var(--accent)">05 · USER STORIES</span><h2 style="margin: 0; font-size: clamp(28px, 3.4vw, 44px); font-weight: 600; letter-spacing: -0.03em; line-height: 1.08">Written from each role’s point of view.</h2>
    <div style="display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; background: rgba(var(--accent-rgb),0.08); border: 1px solid rgba(var(--accent-rgb),0.25)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; color: var(--accent); padding-top: 3px; white-space: nowrap">KEY TAKEAWAY</span><span style="font-size: 16px; font-weight: 600; line-height: 1.45">Every story starts with a role’s first question.</span></div>
    <div style="display: flex; flex-direction: column; gap: 10px"><div style="padding: 18px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.06em; color: var(--muted)">STORY 01</span><p style="margin: 0; font-size: 16px; line-height: 1.5">As <b>a Technician</b>, I want to <b style="color: var(--accent)">see how many of my requests are New, Escalated or In Progress</b>, so that I know what to pick up first.</p></div><div style="padding: 18px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.06em; color: var(--muted)">STORY 02</span><p style="margin: 0; font-size: 16px; line-height: 1.5">As <b>a Supervisor</b>, I want to <b style="color: var(--accent)">see requests escalated to my level</b>, so that I can step in before they climb further.</p></div><div style="padding: 18px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.06em; color: var(--muted)">STORY 03</span><p style="margin: 0; font-size: 16px; line-height: 1.5">As <b>a TTD Official</b>, I want to <b style="color: var(--accent)">see status by block, sorted by most escalated</b>, so that I know which building needs attention.</p></div><div style="padding: 18px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.06em; color: var(--muted)">STORY 04</span><p style="margin: 0; font-size: 16px; line-height: 1.5">As <b>a Technician</b>, I want to <b style="color: var(--accent)">create a request by block, unit and category, and speak it instead of typing</b>, so that I can log issues quickly on site.</p></div><div style="padding: 18px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.06em; color: var(--muted)">STORY 05</span><p style="margin: 0; font-size: 16px; line-height: 1.5">As <b>any user</b>, I want to <b style="color: var(--accent)">attach and play video and audio in a request</b>, so that the problem and the fix are clear without a site visit.</p></div><div style="padding: 18px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.06em; color: var(--muted)">STORY 06</span><p style="margin: 0; font-size: 16px; line-height: 1.5">As <b>any user</b>, I want to <b style="color: var(--accent)">be logged out of my old device when I sign in on a new one</b>, so that access stays secure and accountable.</p></div></div></section><section id="users" style="padding: 52px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 18px">
    <span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: var(--accent)">06 · USERS &amp; ROLES</span><h2 style="margin: 0; font-size: clamp(28px, 3.4vw, 44px); font-weight: 600; letter-spacing: -0.03em; line-height: 1.08">Three roles, three first questions.</h2>
    <div style="display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; background: rgba(var(--accent-rgb),0.08); border: 1px solid rgba(var(--accent-rgb),0.25)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; color: var(--accent); padding-top: 3px; white-space: nowrap">KEY TAKEAWAY</span><span style="font-size: 16px; font-weight: 600; line-height: 1.45">Same app, three jobs, try switching roles below.</span></div>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px"><div style="padding: 20px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); "><div style="display: flex; align-items: center; gap: 12px"><span style="width: 44px; height: 44px; border-radius: 50%; background: rgba(var(--accent-rgb),0.18); color: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px">T</span><span><b style="font-size: 16px">Technician</b><br><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; color: var(--muted)">Serviced By</span></span></div><p style="margin: 12px 0; font-size: 14px; line-height: 1.5; color: var(--ink-2)">Fixes issues on the ground, phone in hand.</p><ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px"><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>Needs their own queue first</span></li><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>Types little, shoots video a lot</span></li></ul></div><div style="padding: 20px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); "><div style="display: flex; align-items: center; gap: 12px"><span style="width: 44px; height: 44px; border-radius: 50%; background: rgba(var(--accent-rgb),0.18); color: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px">S</span><span><b style="font-size: 16px">Supervisor</b><br><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; color: var(--muted)">Supervised By</span></span></div><p style="margin: 12px 0; font-size: 14px; line-height: 1.5; color: var(--ink-2)">Assigns, verifies and closes; owns an escalation level.</p><ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px"><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>Needs what’s escalated to them</span></li><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>Verifies completed jobs</span></li></ul></div><div style="padding: 20px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); "><div style="display: flex; align-items: center; gap: 12px"><span style="width: 44px; height: 44px; border-radius: 50%; background: rgba(var(--accent-rgb),0.18); color: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px">O</span><span><b style="font-size: 16px">TTD Official</b><br><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; color: var(--muted)">MC Member</span></span></div><p style="margin: 12px 0; font-size: 14px; line-height: 1.5; color: var(--ink-2)">Oversees the whole ADDA and gets the final escalations.</p><ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px"><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>Needs the block-level picture</span></li><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>Acts on L6 escalations</span></li></ul></div></div><div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: center; padding: 22px; border-radius: 20px; background: var(--surface-2)">
    <div style="flex: 1 1 280px; display: flex; flex-direction: column; gap: 14px">
    <span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.06em; color: var(--accent)">TRY IT · SWITCH ROLE</span>
    <div role="group" aria-label="Role" style="display: flex; flex-wrap: wrap; gap: 6px"><sc-for list="{{roles}}" as="r" hint-placeholder-count="3"><button onClick="{{r.pick}}" aria-pressed="{{r.on}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: {{r.bg}}; color: {{r.fg}}; font-weight: 600; font-size: 14px">{{r.label}}</button></sc-for></div>
    <div class="fade" key="{{roleKey}}" style="display: flex; flex-direction: column; gap: 8px">
