  <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&amp;family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet">

  <!-- Styles -->
  <style>
body{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.theme-dark{--bg:#0B0B0C;--bg-rgb:11,11,12;--ink:#F2F1EC;--ink-rgb:242,241,236;--surface:#111113;--surface-2:#17171A;--muted:#A7A69F;--ink-2:#C9C8C1;--accent:#8F9BFF;--accent-rgb:143,155,255;--pain:#FF8C7A;--pain-bg:rgba(255,140,122,0.10);--fix:#3DD68C;--fix-bg:rgba(61,214,140,0.10);--line:rgba(242,241,236,0.12)}
.theme-light{--bg:#F4F3EF;--bg-rgb:244,243,239;--ink:#121212;--ink-rgb:18,18,18;--surface:#FFFFFF;--surface-2:#EAE9E4;--muted:#5E5D57;--ink-2:#3F3F3B;--accent:#2B3CFF;--accent-rgb:43,60,255;--pain:#C8372D;--pain-bg:rgba(200,55,45,0.07);--fix:#1E7A46;--fix-bg:rgba(30,122,70,0.08);--line:rgba(18,18,18,0.12)}
.fade{animation:fade .45s ease both}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (max-width:900px){.toc{display:none !important}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
  </style>
</head>
<body>
  <!--
    The page is rendered from the <template> below by js/runtime.js.
    {{ ... }} bindings, <sc-if> and <sc-for> are resolved against js/case05-arm-dashboard.js.
  -->
  <div id="app"></div>
  <template id="dc-template">
    <div class="{{themeClass}}" onScroll="{{onScroll}}" style="position: relative; height: 100vh; overflow-y: auto; overflow-x: hidden; background: var(--bg); color: var(--ink); font-family: 'Familjen Grotesk', 'Helvetica Neue', Helvetica, sans-serif; transition: background-color .3s, color .3s"><div style="position: sticky; top: 0; z-index: 15; height: 3px; background: var(--line)"><div style="height: 100%; width: {{pct}}%; background: var(--accent); transition: width .15s"></div></div>
    <div style="max-width: 1280px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 48px); display: flex; gap: 56px; align-items: flex-start">
    <aside class="toc" style="flex: 0 0 220px; position: sticky; top: 3px; padding: 32px 0; display: flex; flex-direction: column; gap: 2px">
    <a href="index.html#work" style="display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; min-height: 36px; padding: 0 14px; margin-bottom: 18px; border-radius: 999px; border: 1px solid var(--line); font-size: 13px; font-weight: 600; text-decoration: none; color: var(--ink)">← Back to portfolio</a><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; color: var(--muted); margin-bottom: 4px">CASE STUDY 05</span><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; color: var(--accent); margin-bottom: 12px">~{{minsLeft}} min left</span><sc-for list="{{toc}}" as="t" hint-placeholder-count="13"><button onClick="{{t.go}}" aria-current="{{t.on}}" style="text-align: left; display: flex; gap: 10px; align-items: center; padding: 7px 0 7px 12px; border-left: 2px solid {{t.bar}}; font-size: 14px; color: {{t.color}}; font-weight: {{t.weight}}; transition: color .2s"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; width: 18px; color: var(--muted)">{{t.mark}}</span>{{t.label}}</button></sc-for>
    <div style="margin-top: 18px"><button onClick="{{toggleTheme}}" aria-label="{{themeLabel}}" style="min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; color: var(--ink)">{{themeText}}</button></div></aside>
    <main style="flex: 1; min-width: 0; max-width: 900px; padding-bottom: 60px">
    <header style="padding: 64px 0 40px; display: flex; flex-direction: column; gap: 20px">
    <span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: var(--muted)">CASE STUDY 05 · ADDA RENTAL MANAGEMENT · 8 MIN READ</span>
    <h1 style="margin: 0; font-size: clamp(40px, 5.4vw, 78px); font-weight: 600; letter-spacing: -0.045em; line-height: 0.98">ARM Dashboard Revamp</h1>
    <p style="margin: 0; font-size: 21px; line-height: 1.45; color: var(--ink-2); max-width: 680px">One command centre for rental property managers, where every number opens the screen behind it.</p>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px"><div style="padding: 18px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--pain)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; color: var(--pain)">PROBLEM</span><p style="margin: 6px 0 0; font-size: 15px; line-height: 1.5">Managers opened five modules to answer four daily questions.</p></div><div style="padding: 18px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--fix)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; color: var(--fix)">SOLUTION</span><p style="margin: 6px 0 0; font-size: 15px; line-height: 1.5">One role-aware dashboard of 13 cards, each drilling into the records behind it.</p></div><div style="padding: 18px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--accent)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; color: var(--accent)">IMPACT</span><p style="margin: 6px 0 0; font-size: 15px; line-height: 1.5">One screen for the daily overview · 13 drill-downs · 13 tracked events.</p></div></div>
    <div style="padding: 20px; border-radius: 20px; background: linear-gradient(160deg, rgba(34,197,94,0.16), rgba(34,197,94,0.03))"><figure style="margin: 0; width: 100%;  border-radius: 12px; overflow: hidden; background: #FFF; box-shadow: 0 24px 50px -26px rgba(0,0,0,0.45), 0 0 0 1px rgba(0,0,0,0.08)"><img src="assets/images/case05-arm-dashboard-01.webp" alt="ARM dashboard revamp" width="1400" height="1620" loading="lazy" style="display: block; width: 100%; height: auto"></figure></div>
    </header>
    <section id="overview" style="padding: 52px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 18px">
    <span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: var(--accent)">01 · OVERVIEW</span><h2 style="margin: 0; font-size: clamp(28px, 3.4vw, 44px); font-weight: 600; letter-spacing: -0.03em; line-height: 1.08">From a status page to a command centre.</h2>
    <div style="display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; background: rgba(var(--accent-rgb),0.08); border: 1px solid rgba(var(--accent-rgb),0.25)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; color: var(--accent); padding-top: 3px; white-space: nowrap">KEY TAKEAWAY</span><span style="font-size: 16px; font-weight: 600; line-height: 1.45">A dashboard rebuilt around the questions managers ask every morning.</span></div>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1px; border-radius: 16px; overflow: hidden; background: var(--line); border: 1px solid var(--line)"><div style="padding: 14px 16px; background: var(--surface); display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.06em; color: var(--muted)">PRODUCT</span><span style="font-size: 15px; font-weight: 600">ADDA Rental Management (ARM)</span></div><div style="padding: 14px 16px; background: var(--surface); display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.06em; color: var(--muted)">USERS</span><span style="font-size: 15px; font-weight: 600">Property managers &amp; office staff</span></div><div style="padding: 14px 16px; background: var(--surface); display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.06em; color: var(--muted)">MY ROLE</span><span style="font-size: 15px; font-weight: 600">Senior Product Designer</span></div><div style="padding: 14px 16px; background: var(--surface); display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.06em; color: var(--muted)">WORKED WITH</span><span style="font-size: 15px; font-weight: 600">Product, web engineering &amp; QA</span></div><div style="padding: 14px 16px; background: var(--surface); display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.06em; color: var(--muted)">YEAR</span><span style="font-size: 15px; font-weight: 600">2026</span></div><div style="padding: 14px 16px; background: var(--surface); display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.06em; color: var(--muted)">REGIONS</span><span style="font-size: 15px; font-weight: 600">UAE · HAS (ARM ADDAs)</span></div></div><p style="margin: 0; font-size: 17px; line-height: 1.6; color: var(--ink-2)">ARM is ADDA’s rental management product for landlords and property managers. Its old dashboard showed data that rarely led to action, so the day still started by opening Units, Contracts, Income Tracker, Helpdesk and Move-In trackers one by one. This revamp turned the dashboard into a role-aware command centre with drill-down on every metric.</p><div style="padding: 20px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); "><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.06em; color: var(--accent)">MY RESPONSIBILITIES</span><div style="height: 10px"></div><ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px"><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>Shaped the scope doc and metric list with PM and stakeholders</span></li><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>Defined each card: what it answers, its formula and where it drills to</span></li><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>Designed the dashboard, quick actions and every card state</span></li><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>Planned phasing, analytics events and release notes</span></li></ul></div></section><section id="problem" style="padding: 52px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 18px">
    <span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: var(--accent)">02 · PROBLEM</span><h2 style="margin: 0; font-size: clamp(28px, 3.4vw, 44px); font-weight: 600; letter-spacing: -0.03em; line-height: 1.08">Simple questions took five modules to answer.</h2>
    <div style="display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; background: rgba(var(--accent-rgb),0.08); border: 1px solid rgba(var(--accent-rgb),0.25)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; color: var(--accent); padding-top: 3px; white-space: nowrap">KEY TAKEAWAY</span><span style="font-size: 16px; font-weight: 600; line-height: 1.45">The data was in ARM. The answers took five modules.</span></div>
    <blockquote style="margin: 0; padding: 20px 24px; border-left: 4px solid var(--pain); background: var(--pain-bg); border-radius: 0 16px 16px 0; font-size: 20px; line-height: 1.5">How many units are vacant right now? Which contracts expire soon? How much rent is still pending? What needs my approval today? Each answer lived in a different module, behind its own filters and reports.</blockquote><div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px"><div style="padding: 16px; border-radius: 14px; background: var(--pain-bg)"><div style="font-size: 16px; font-weight: 600">“How many units are vacant right now?”</div><div style="margin-top: 6px; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; color: var(--pain)">→ Units &amp; Users</div></div><div style="padding: 16px; border-radius: 14px; background: var(--pain-bg)"><div style="font-size: 16px; font-weight: 600">“Which contracts are expiring soon?”</div><div style="margin-top: 6px; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; color: var(--pain)">→ Contracts › Reports</div></div><div style="padding: 16px; border-radius: 14px; background: var(--pain-bg)"><div style="font-size: 16px; font-weight: 600">“How much rent is still pending?”</div><div style="margin-top: 6px; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; color: var(--pain)">→ Income Tracker</div></div><div style="padding: 16px; border-radius: 14px; background: var(--pain-bg)"><div style="font-size: 16px; font-weight: 600">“What needs my approval today?”</div><div style="margin-top: 6px; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; color: var(--pain)">→ 5 different modules</div></div></div><p style="margin: 0; font-size: 17px; line-height: 1.6; color: var(--ink-2)">Managers lost time jumping between screens, renewals and bounced cheques slipped through, and decisions waited on someone reading a report.</p></section><section id="pains" style="padding: 52px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 18px">
    <span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: var(--accent)">03 · PAIN POINTS</span><h2 style="margin: 0; font-size: clamp(28px, 3.4vw, 44px); font-weight: 600; letter-spacing: -0.03em; line-height: 1.08">Eight pains from the FS.</h2>
    <div style="display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; background: rgba(var(--accent-rgb),0.08); border: 1px solid rgba(var(--accent-rgb),0.25)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; color: var(--accent); padding-top: 3px; white-space: nowrap">KEY TAKEAWAY</span><span style="font-size: 16px; font-weight: 600; line-height: 1.45">Eight pains, one cause: no single place to look.</span></div>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px"><div style="display: flex; gap: 14px; padding: 16px 18px; border-radius: 16px; background: var(--pain-bg); border: 1px solid color-mix(in srgb, var(--pain) 35%, transparent)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; color: var(--pain); font-weight: 700">P1</span><span style="display: flex; flex-direction: column; gap: 4px"><b style="font-size: 16px">Too many screens for simple information</b><span style="font-size: 14px; line-height: 1.5; color: var(--ink-2)">Units, Contracts and Tenant lists opened separately just for a morning overview.</span></span></div><div style="display: flex; gap: 14px; padding: 16px 18px; border-radius: 16px; background: var(--pain-bg); border: 1px solid color-mix(in srgb, var(--pain) 35%, transparent)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; color: var(--pain); font-weight: 700">P2</span><span style="display: flex; flex-direction: column; gap: 4px"><b style="font-size: 16px">No snapshot of occupancy</b><span style="font-size: 14px; line-height: 1.5; color: var(--ink-2)">Answering “how many units are vacant?” meant checking tenant lists by hand.</span></span></div><div style="display: flex; gap: 14px; padding: 16px 18px; border-radius: 16px; background: var(--pain-bg); border: 1px solid color-mix(in srgb, var(--pain) 35%, transparent)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; color: var(--pain); font-weight: 700">P3</span><span style="display: flex; flex-direction: column; gap: 4px"><b style="font-size: 16px">Renewals easy to miss</b><span style="font-size: 14px; line-height: 1.5; color: var(--ink-2)">Expiring contracts were found through filtered reports, so some slipped through.</span></span></div><div style="display: flex; gap: 14px; padding: 16px 18px; border-radius: 16px; background: var(--pain-bg); border: 1px solid color-mix(in srgb, var(--pain) 35%, transparent)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; color: var(--pain); font-weight: 700">P4</span><span style="display: flex; flex-direction: column; gap: 4px"><b style="font-size: 16px">No view of collections</b><span style="font-size: 14px; line-height: 1.5; color: var(--ink-2)">Rent collected vs pending needed income reports and manual reading.</span></span></div><div style="display: flex; gap: 14px; padding: 16px 18px; border-radius: 16px; background: var(--pain-bg); border: 1px solid color-mix(in srgb, var(--pain) 35%, transparent)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; color: var(--pain); font-weight: 700">P5</span><span style="display: flex; flex-direction: column; gap: 4px"><b style="font-size: 16px">Cheque actions missed</b><span style="font-size: 14px; line-height: 1.5; color: var(--ink-2)">Cheques due for deposit or bounced sat inside Cheque Management.</span></span></div><div style="display: flex; gap: 14px; padding: 16px 18px; border-radius: 16px; background: var(--pain-bg); border: 1px solid color-mix(in srgb, var(--pain) 35%, transparent)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; color: var(--pain); font-weight: 700">P6</span><span style="display: flex; flex-direction: column; gap: 4px"><b style="font-size: 16px">Approvals scattered</b><span style="font-size: 14px; line-height: 1.5; color: var(--ink-2)">Helpdesk, forms, POs, PRs and move-ins each lived in a different module.</span></span></div><div style="display: flex; gap: 14px; padding: 16px 18px; border-radius: 16px; background: var(--pain-bg); border: 1px solid color-mix(in srgb, var(--pain) 35%, transparent)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; color: var(--pain); font-weight: 700">P7</span><span style="display: flex; flex-direction: column; gap: 4px"><b style="font-size: 16px">Move-ins planned blind</b><span style="font-size: 14px; line-height: 1.5; color: var(--ink-2)">Access cards and parking were prepared from manually reviewed forms.</span></span></div><div style="display: flex; gap: 14px; padding: 16px 18px; border-radius: 16px; background: var(--pain-bg); border: 1px solid color-mix(in srgb, var(--pain) 35%, transparent)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; color: var(--pain); font-weight: 700">P8</span><span style="display: flex; flex-direction: column; gap: 4px"><b style="font-size: 16px">Service, sentiment and adoption hidden</b><span style="font-size: 14px; line-height: 1.5; color: var(--ink-2)">Top complaints, happiness and app usage were buried in separate reports.</span></span></div></div></section><section id="goals" style="padding: 52px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 18px">
    <span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: var(--accent)">04 · GOALS</span><h2 style="margin: 0; font-size: clamp(28px, 3.4vw, 44px); font-weight: 600; letter-spacing: -0.03em; line-height: 1.08">What success looks like.</h2>
    <div style="display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; background: rgba(var(--accent-rgb),0.08); border: 1px solid rgba(var(--accent-rgb),0.25)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; color: var(--accent); padding-top: 3px; white-space: nowrap">KEY TAKEAWAY</span><span style="font-size: 16px; font-weight: 600; line-height: 1.45">Success = see it, click it, act on it.</span></div>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px"><div style="padding: 20px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); "><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.06em; color: var(--accent)">USER GOALS</span><div style="height: 10px"></div><ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px"><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>Answer the daily questions on one screen</span></li><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>Go from any number to the records behind it</span></li><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>Spot risk early: expiries, bounces, escalations</span></li></ul></div><div style="padding: 20px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); "><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.06em; color: var(--accent)">BUSINESS GOALS</span><div style="height: 10px"></div><ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px"><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>Cut navigation across ARM modules</span></li><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>A role-aware command centre for office staff</span></li><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="col
