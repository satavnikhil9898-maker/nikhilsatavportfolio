<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nikhil Satav: Portfolio (Hero, Work, Process)</title>
  <meta name="description" content="Nikhil Satav — Senior Product Designer. B2B SaaS and enterprise product design case studies.">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!--
    The page is rendered from the <template> below by js/runtime.js.
    {{ ... }} bindings, <sc-if> and <sc-for> are resolved against js/app.js.
  -->
  <div id="app"></div>
  <template id="dc-template">
    <main class="{{themeClass}}" style="background: var(--bg); color: var(--ink); transition: background-color .4s, color .4s">
      <div class="fitsec" onPointerMove="{{onMove}}" style="position: relative; height: max(620px, min(100vh, 960px)); box-sizing: border-box; container-type: size;  overflow: hidden; background: var(--bg); color: var(--ink); font-family: 'Familjen Grotesk', 'Helvetica Neue', Helvetica, sans-serif; cursor: crosshair">

        <div aria-hidden="true" style="position: absolute; inset: 0">
          <sc-for list="{{words}}" as="w" hint-placeholder-count="12">
            <span style="position: absolute; left: {{w.x}}; top: {{w.y}}; transform: rotate({{w.r}}deg); font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: {{w.s}}px; color: var(--faint); text-decoration: line-through; text-decoration-color: #C2410C; white-space: nowrap">{{w.bad}}</span>
          </sc-for>
        </div>

        <div aria-hidden="true" style="position: absolute; inset: 0; background: var(--bg); -webkit-mask-image: {{mask}}; mask-image: {{mask}}">
          <sc-for list="{{words}}" as="w" hint-placeholder-count="12">
            <span style="position: absolute; left: {{w.x}}; top: {{w.y}}; font-size: {{w.s2}}px; font-weight: 600; color: var(--ink); white-space: nowrap; letter-spacing: -0.01em"><span style="color: var(--accent)">✓</span> {{w.good}}</span>
          </sc-for>
        </div>

        <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 320px; height: 320px; margin: -160px 0 0 -160px; border-radius: 50%; border: 1px solid rgba(var(--accent-rgb),0.45); pointer-events: none; transform: translate({{mx}}px, {{my}}px); display: {{ringDisplay}}"></div>

        <header style="position: relative; z-index: 2; max-width: 1280px; margin: 0 auto; padding: 24px clamp(20px, 5vw, 64px); display: flex; justify-content: space-between; align-items: center">
          <div style="display: flex; align-items: center; gap: 12px">
            <span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: var(--bg); display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; font-weight: 500">NS</span>
            <span style="display: flex; flex-direction: column; gap: 2px; line-height: 1.2">
              <span style="font-size: 15px; font-weight: 600">Nikhil Satav</span>
              <span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: var(--muted)">Senior Product Designer</span>
            </span>
          </div>
          <div style="display: flex; align-items: center; gap: 10px">
            <button onClick="{{toggleTheme}}" aria-label="{{themeLabel}}" style="height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(var(--ink-rgb),0.25); display: flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px">
              <sc-if value="{{isDark}}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
              <sc-if value="{{isLight}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg></sc-if>
              <span>{{themeText}}</span>
            </button>
            <button onClick="{{toggleAll}}" aria-pressed="{{allPressed}}" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid rgba(var(--ink-rgb),0.25); font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; background: {{allBg}}">{{allLabel}}</button>
          </div>
        </header>

        <div style="position: relative; z-index: 2; height: calc(100% - 92px); display: flex; align-items: center; justify-content: center; padding: 0 20px 16px; box-sizing: border-box; pointer-events: none">
          <div style="display: flex; flex-direction: column; align-items: center; gap: clamp(10px, 2.4cqh, 22px); text-align: center; padding: clamp(18px, 4cqh, 40px) clamp(20px, 4vw, 48px); border-radius: 28px; background: rgba(var(--bg-rgb),0.82); max-width: 760px; pointer-events: auto">
            <sc-if value="{{idTag}}" hint-placeholder-val="{{ true }}">
              <span style="display: inline-flex; align-items: center; gap: 12px; padding: 6px 18px 6px 6px; border-radius: 999px; background: rgba(var(--ink-rgb),0.06); border: 1px solid rgba(var(--ink-rgb),0.16)">
                <span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: var(--bg); display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; font-weight: 500">NS</span>
                <span style="display: flex; flex-direction: column; align-items: flex-start; gap: 1px; line-height: 1.2"><span style="font-size: 18px; font-weight: 600; color: var(--ink)">Hi, I’m Nikhil Satav</span><span style="font-size: 14px; color: var(--ink-2)">Senior Product Designer</span></span>
              </span>
            </sc-if>
            <sc-if value="{{idCursor}}" hint-placeholder-val="{{ false }}">
              <span style="display: inline-flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left">
                <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3l16 8-7 2-3 7z" fill="var(--accent)" stroke="var(--bg)" stroke-width="1.5" stroke-linejoin="round"></path></svg>
                <span style="margin-left: 16px; display: flex; flex-direction: column; gap: 2px; padding: 8px 14px; border-radius: 4px 14px 14px 14px; background: var(--accent); color: var(--bg)"><span style="font-size: 17px; font-weight: 600">Nikhil Satav</span><span style="font-size: 13px; opacity: 0.85">Senior Product Designer</span></span>
              </span>
            </sc-if>
            <sc-if value="{{idBig}}" hint-placeholder-val="{{ false }}">
              <span style="display: flex; flex-direction: column; align-items: center; gap: 6px">
                <span style="font-size: clamp(26px, 2.6vw, 34px); font-weight: 600; letter-spacing: -0.02em; color: var(--ink)">Nikhil Satav<span style="color: var(--accent)">.</span></span>
                <span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; letter-spacing: 0.06em; color: var(--ink-2)">SENIOR PRODUCT DESIGNER · B2B SAAS · ENTERPRISE</span>
              </span>
            </sc-if>
            <sc-if value="{{idCard}}" hint-placeholder-val="{{ false }}">
              <span style="display: inline-flex; align-items: center; gap: 14px; padding: 10px 20px 10px 10px; border-radius: 20px; background: var(--surface); border: 1px solid rgba(var(--ink-rgb),0.14); text-align: left; box-shadow: 0 20px 40px -24px rgba(0,0,0,0.5)">
                <svg key="idkey" width="56" height="56" viewBox="0 0 120 120" role="img" aria-label="Illustrated avatar of Nikhil" style="display: block; border-radius: 50%; background: #2A2D3A; flex-shrink: 0">
                  <path d="M18 120c0-27 19-42 42-42s42 15 42 42z" fill="#8F9BFF"></path>
                  <path d="M50 80l10 12 10-12" fill="#F2F1EC"></path>
                  <rect x="52" y="66" width="16" height="16" rx="4" fill="#A9714B"></rect>
                  <circle cx="37" cy="52" r="5" fill="#A9714B"></circle><circle cx="83" cy="52" r="5" fill="#A9714B"></circle>
                  <ellipse cx="60" cy="50" rx="23" ry="26" fill="#B98058"></ellipse>
                  <path d="M36 50c-3-20 9-33 25-33 15 0 26 11 23 31-3-9-9-14-16-15-8 6-20 7-32 17z" fill="#1E1A17"></path>
                  <path d="M44 66c4 9 10 12 16 12s12-3 16-12c-4 4-9 5-16 5s-12-1-16-5z" fill="#3A2A20"></path>
                  <g style="transform-origin: 60px 52px"><circle cx="51.5" cy="53" r="2.4" fill="#1E1A17"></circle><circle cx="68.5" cy="53" r="2.4" fill="#1E1A17"></circle></g>
                  <rect x="43.5" y="46.5" width="16" height="12" rx="4" fill="none" stroke="#1E1A17" stroke-width="1.8"></rect><rect x="60.5" y="46.5" width="16" height="12" rx="4" fill="none" stroke="#1E1A17" stroke-width="1.8"></rect><path d="M59.5 51h1" stroke="#1E1A17" stroke-width="1.8"></path>
                  <path d="M46 43c3-2 7-2 10-1M64 42c3-1 7-1 10 1" stroke="#1E1A17" stroke-width="2" stroke-linecap="round" fill="none"></path>
                  <path d="M53 65c3 3 11 3 14 0" fill="none" stroke="#5A2E1C" stroke-width="2.2" stroke-linecap="round"></path>
                  <path opacity="0" d="M54 64h12c0 5-3 7-6 7s-6-2-6-7z" fill="#5A2E1C"></path>
                </svg>
                <span style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 18px; font-weight: 600; color: var(--ink)">Nikhil Satav</span><span style="font-size: 14px; color: var(--ink-2)">Senior Product Designer</span><span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #3DD68C"><span style="width: 7px; height: 7px; border-radius: 50%; background: #3DD68C"></span>Open to senior &amp; lead roles</span></span>
              </span>
            </sc-if>
            <sc-if value="{{idHello}}" hint-placeholder-val="{{ false }}">
              <span style="font-size: clamp(20px, 2vw, 26px); line-height: 1.35; color: var(--ink-2)">Hi, I’m <span style="color: var(--ink); font-weight: 600; border-bottom: 3px solid var(--accent); padding-bottom: 2px">Nikhil Satav</span>, a Senior Product Designer.</span>
            </sc-if>
            <h1 style="margin: 0; font-size: clamp(40px, min(7.5vw, 11cqh), 104px); font-weight: 600; line-height: 0.95; letter-spacing: -0.045em">I turn chaos<br>into <span style="color: var(--accent)">clarity.</span></h1>
            <p style="margin: 0; font-size: 18px; line-height: 1.5; color: var(--ink-2)">Move your cursor around: every messy problem has a cleaner answer underneath.</p>
            <a href="#work" style="min-height: 48px; display: inline-flex; align-items: center; gap: 10px; padding: 0 24px; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: 16px; font-weight: 600">See how I did it <span aria-hidden="true">→</span></a>
          </div>
        </div>
      </div>
      <section id="work" class="fitsec" style="height: max(620px, min(100vh, 960px)); box-sizing: border-box; container-type: size; background: var(--bg); color: var(--ink); font-family: 'Familjen Grotesk', 'Helvetica Neue', Helvetica, sans-serif; border-top: 1px solid rgba(var(--ink-rgb),0.10)">
        <div style="max-width: 1200px; height: 100%; box-sizing: border-box; margin: 0 auto; padding: clamp(24px, 6cqh, 72px) clamp(20px, 5vw, 64px); display: flex; flex-direction: column; justify-content: center; gap: clamp(16px, 4cqh, 40px)">

          <div style="display: flex; flex-direction: column; gap: 20px; max-width: 860px">
            <span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; color: var(--muted)">Selected work</span>
            <h2 style="margin: 0; font-size: clamp(26px, min(4.2vw, 5.2cqh), 52px); font-weight: 500; line-height: 1.12; letter-spacing: -0.03em">Five messy problems, and the <span style="color: var(--accent)">clear products</span> I turned them into.</h2>
          </div>

          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px">

            <a href="case01-custom-fields.html" class="s2card" style="border-radius: 24px; background: var(--surface); border: 1px solid rgba(var(--ink-rgb),0.12); overflow: hidden; display: flex; flex-direction: column">
              <div style="height: clamp(72px, 16cqh, 200px); background: linear-gradient(160deg, #E7F2EB, #CFE5D7); display: flex; align-items: flex-end; justify-content: center; overflow: hidden" aria-hidden="true"><img src="assets/images/case01-custom-fields.webp" alt="" style="width: 86%; max-width: 300px; height: 90%; object-fit: cover; object-position: left top; border-radius: 10px 10px 0 0; box-shadow: 0 10px 30px -12px rgba(0,0,0,0.35)"></div>
              <div style="padding: 22px; display: flex; flex-direction: column; gap: 12px; flex-grow: 1">
                <span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: var(--muted)">ADDA ERP · Community management</span>
                <span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 14px; color: var(--muted); text-decoration: line-through; text-decoration-color: #E4572E">Community data kept in a spreadsheet</span>
                <h3 style="margin: 0; font-size: 20px; font-weight: 600; line-height: 1.22; letter-spacing: -0.02em"><span style="color: var(--accent)">✓</span> Custom Fields: every community’s own data, inside ADDA</h3>
                <span style="font-size: 15px; color: var(--muted)">Senior Product <span style="white-space: nowrap">Designer · 2026</span></span>
                <span style="margin-top: auto; padding-top: 12px; font-size: 15px; font-weight: 600">Read case study <span class="s2arrow" aria-hidden="true">→</span></span>
              </div>
            </a>

            <a href="case02-vendor-portal.html" class="s2card" style="border-radius: 24px; background: var(--surface); border: 1px solid rgba(var(--ink-rgb),0.12); overflow: hidden; display: flex; flex-direction: column">
              <div style="height: clamp(72px, 16cqh, 200px); background: linear-gradient(160deg, #E6F1EC, #CFE3D9); display: flex; align-items: flex-end; justify-content: center; overflow: hidden" aria-hidden="true"><img src="assets/images/case02-vendor-portal.webp" alt="" style="width: 86%; max-width: 300px; height: 90%; object-fit: cover; object-position: left top; border-radius: 10px 10px 0 0; box-shadow: 0 10px 30px -12px rgba(0,0,0,0.35)"></div>
              <div style="padding: 22px; display: flex; flex-direction: column; gap: 12px; flex-grow: 1">
                <span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: var(--muted)">ADDA · Vendor Portal · Web</span>
                <span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 14px; color: var(--muted); text-decoration: line-through; text-decoration-color: #E4572E">Every invoice re-typed by the office</span>
                <h3 style="margin: 0; font-size: 20px; font-weight: 600; line-height: 1.22; letter-spacing: -0.02em"><span style="color: var(--accent)">✓</span> A vendor portal where suppliers submit deliveries and invoices themselves</h3>
                <span style="font-size: 15px; color: var(--muted)">Senior Product <span style="white-space: nowrap">Designer · 2026</span></span>
                <span style="margin-top: auto; padding-top: 12px; font-size: 15px; font-weight: 600">Read case study <span class="s2arrow" aria-hidden="true">→</span></span>
              </div>
            </a>

            <a href="case03-ttd-ccc.html" class="s2card" style="border-radius: 24px; background: var(--surface); border: 1px solid rgba(var(--ink-rgb),0.12); overflow: hidden; display: flex; flex-direction: column">
              <div style="height: clamp(72px, 16cqh, 200px); background: linear-gradient(160deg, #E9F3EC, #D3E8DA); display: flex; align-items: flex-end; justify-content: center; overflow: hidden" aria-hidden="true"><div style="width: 78%; max-width: 230px; height: 90%; border-radius: 10px 10px 0 0; background: #FFFFFF; box-shadow: 0 10px 30px -12px rgba(0,0,0,0.35); overflow: hidden; display: flex; flex-direction: column"><div style="padding: 6px 9px; background: #17643A; color: #FFF; font-size: 8px; font-weight: 600">TTD Service Management Dashboard</div><div style="padding: 8px; display: flex; flex-direction: column; gap: 6px"><div style="display: flex; height: 8px; border-radius: 3px; overflow: hidden"><span style="flex: 128; background: #2E7D32"></span><span style="flex: 60; background: #6CC08B"></span><span style="flex: 48; background: #F08C00"></span><span style="flex: 96; background: #E57373"></span><span style="flex: 24; background: #D32F2F"></span></div><div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; font-size: 8px"><span style="padding: 3px; border: 1px solid #E7E9EC; border-radius: 4px"><b>1,200</b><br>Target</span><span style="padding: 3px; border: 1px solid #E7E9EC; border-radius: 4px; color: #2E7D32"><b>873</b><br>Done</span><span style="padding: 3px; border: 1px solid #E7E9EC; border-radius: 4px; color: #EF6C00"><b>327</b><br>Pending</span><span style="padding: 3px; border: 1px solid #E7E9EC; border-radius: 4px; color: #7E3FF2"><b>72.8%</b><br>Achieved</span></div></div></div></div>
              <div style="padding: 22px; display: flex; flex-direction: column; gap: 12px; flex-grow: 1">
                <span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: var(--muted)">TTD · CCC dashboard · Web</span>
                <span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 14px; color: var(--muted); text-decoration: line-through; text-decoration-color: #E4572E">A weekly spreadsheet review</span>
                <h3 style="margin: 0; font-size: 20px; font-weight: 600; line-height: 1.22; letter-spacing: -0.02em"><span style="color: var(--accent)">✓</span> A live inspection dashboard that drills down to the photo</h3>
                <span style="font-size: 15px; color: var(--muted)">Senior Product <span style="white-space: nowrap">Designer · 2026</span></span>
                <span style="margin-top: auto; padding-top: 12px; font-size: 15px; font-weight: 600">Read case study <span class="s2arrow" aria-hidden="true">→</span></span>
              </div>
            </a>

            <a href="case04-ttd-helpdesk.html" class="s2card" style="border-radius: 24px; background: var(--surface); border: 1px solid rgba(var(--ink-rgb),0.12); overflow: hidden; display: flex; flex-direction: column">
              <div style="height: clamp(72px, 16cqh, 200px); background: linear-gradient(160deg, #E6F3F0, #CFE8E2); display: flex; align-items: flex-end; justify-content: center; overflow: hidden" aria-hidden="true"><div style="width: 62%; max-width: 190px; height: 92%; border-radius: 14px 14px 0 0; background: #FFFFFF; box-shadow: 0 10px 30px -12px rgba(0,0,0,0.35); overflow: hidden; display: flex; flex-direction: column"><div style="padding: 8px 10px; background: #00796B; color: #FFF; font-size: 9px; font-weight: 600">Welcome! Pratik Varma</div><div style="padding: 8px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px"><span style="padding: 4px; border-radius: 5px; border: 1px solid #4DA3E0; background: #F2F8FD; color: #1E78C8; font-size: 9px; font-weight: 700">125<br><span style="font-weight: 400; color: #444">New</span></span><span style="padding: 4px; border-radius: 5px; border: 1px solid #E5484D; background: #FDF1F1; color: #D93A3A; font-size: 9px; font-weight: 700">125<br><span style="font-weight: 400; color: #444">Escalated</span></span><span style="padding: 4px; border-radius: 5px; border: 1px solid #F28C28; background: #FFF6EC; color: #E07A10; font-size: 9px; font-weight: 700">125<br><span style="font-weight: 400; color: #444">In Progress</span></span></div><div style="margin: 0 8px; height: 6px; border-radius: 3px; background: #EEF0F2"></div><div style="margin: 5px 8px; height: 6px; width: 70%; border-radius: 3px; background: #EEF0F2"></div></div></div>
              <div style="padding: 22px; display: flex; flex-direction: column; gap: 12px; flex-grow: 1">
                <span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: var(--muted)">TTD · Nandakam app · Field service</span>
                <span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 14px; color: var(--muted); text-decoration: line-through; text-decoration-color: #E4572E">One long, unsorted request list</span>
                <h3 style="margin: 0; font-size: 20px; font-weight: 600; line-height: 1.22; letter-spacing: -0.02em"><span style="color: var(--accent)">✓</span> A role-based helpdesk that shows TTD staff what needs attention first</h3>
                <span style="font-size: 15px; color: var(--muted)">Senior Product <span style="white-space: nowrap">Designer · 2026</span></span>
                <span style="margin-top: auto; padding-top: 12px; font-size: 15px; font-weight: 600">Read case study <span class="s2arrow" aria-hidden="true">→</span></span>
              </div>
            </a>

            <a href="case05-arm-dashboard.html" class="s2card" style="border-radius: 24px; background: var(--surface); border: 1px solid rgba(var(--ink-rgb),0.12); overflow: hidden; display: flex; flex-direction: column">
              <div style="height: clamp(72px, 16cqh, 200px); background: linear-gradient(160deg, #E8F7EC, #CDEED7); display: flex; align-items: flex-end; justify-content: center; overflow: hidden" aria-hidden="true"><img src="assets/images/case05-arm-dashboard.webp" alt="" style="width: 86%; max-width: 300px; height: 90%; object-fit: cover; object-position: left top; border-radius: 10px 10px 0 0; box-shadow: 0 10px 30px -12px rgba(0,0,0,0.35)"></div>
              <div style="padding: 22px; display: flex; flex-direction: column; gap: 12px; flex-grow: 1">
                <span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: var(--muted)">ADDA Rental Management · Web</span>
                <span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 14px; color: var(--muted); text-decoration: line-through; text-decoration-color: #E4572E">Five modules for one overview</span>
