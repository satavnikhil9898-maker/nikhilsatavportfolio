    <p style="margin: 0; font-size: 22px; line-height: 1.45; color: var(--ink-2); max-width: 640px">Giving every community a home for the data it used to keep in a spreadsheet.</p>
    <div style="display: flex; flex-wrap: wrap; gap: 14px; align-items: stretch"><div style="flex: 1 1 300px; padding: 18px; border-radius: 18px; background: var(--pain-bg); display: flex; flex-direction: column; gap: 12px"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.06em; color: var(--pain)">BEFORE</span><div style="width: 420px; max-width: 100%"><div style="border-radius: 8px; overflow: hidden; background: #FFF; color: #222; box-shadow: 0 24px 50px -24px rgba(0,0,0,0.45), 0 0 0 1px rgba(0,0,0,0.06); font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 10px"><div style="padding: 6px 9px; background: #1E7A46; color: #FFF">units_FINAL_v3 (2).xlsx</div><div style="display: flex; background: #F3F3F3"><span style="flex: 1; padding: 5px 6px; border-right: 1px solid #D0D0D0; font-weight: 700">Unit</span><span style="flex: 1; padding: 5px 6px; border-right: 1px solid #D0D0D0; font-weight: 700">Pool</span><span style="flex: 1; padding: 5px 6px; border-right: 1px solid #D0D0D0; font-weight: 700">Shutter</span><span style="flex: 1; padding: 5px 6px; border-right: 1px solid #D0D0D0; font-weight: 700">Parking</span></div><div style="display: flex; border-top: 1px solid #ECECEC"><span style="flex: 1; padding: 5px 6px; border-right: 1px solid #E0E0E0;  white-space: nowrap; overflow: hidden; text-overflow: ellipsis">11</span><span style="flex: 1; padding: 5px 6px; border-right: 1px solid #E0E0E0;  white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Yes</span><span style="flex: 1; padding: 5px 6px; border-right: 1px solid #E0E0E0;  white-space: nowrap; overflow: hidden; text-overflow: ellipsis">No</span><span style="flex: 1; padding: 5px 6px; border-right: 1px solid #E0E0E0;  white-space: nowrap; overflow: hidden; text-overflow: ellipsis">P-101</span></div><div style="display: flex; border-top: 1px solid #ECECEC"><span style="flex: 1; padding: 5px 6px; border-right: 1px solid #E0E0E0;  white-space: nowrap; overflow: hidden; text-overflow: ellipsis">12</span><span style="flex: 1; padding: 5px 6px; border-right: 1px solid #E0E0E0; background: #FFE1DC; color: #9A2E1E; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Yes?</span><span style="flex: 1; padding: 5px 6px; border-right: 1px solid #E0E0E0;  white-space: nowrap; overflow: hidden; text-overflow: ellipsis">No</span><span style="flex: 1; padding: 5px 6px; border-right: 1px solid #E0E0E0; background: #FFE1DC; color: #9A2E1E; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">see notes</span></div><div style="display: flex; border-top: 1px solid #ECECEC"><span style="flex: 1; padding: 5px 6px; border-right: 1px solid #E0E0E0;  white-space: nowrap; overflow: hidden; text-overflow: ellipsis">14</span><span style="flex: 1; padding: 5px 6px; border-right: 1px solid #E0E0E0;  white-space: nowrap; overflow: hidden; text-overflow: ellipsis">No</span><span style="flex: 1; padding: 5px 6px; border-right: 1px solid #E0E0E0; background: #FFE1DC; color: #9A2E1E; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">?</span><span style="flex: 1; padding: 5px 6px; border-right: 1px solid #E0E0E0;  white-space: nowrap; overflow: hidden; text-overflow: ellipsis">P-110</span></div><div style="display: flex; border-top: 1px solid #ECECEC"><span style="flex: 1; padding: 5px 6px; border-right: 1px solid #E0E0E0;  white-space: nowrap; overflow: hidden; text-overflow: ellipsis">15</span><span style="flex: 1; padding: 5px 6px; border-right: 1px solid #E0E0E0; background: #FFE1DC; color: #9A2E1E; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">?</span><span style="flex: 1; padding: 5px 6px; border-right: 1px solid #E0E0E0;  white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Yes</span><span style="flex: 1; padding: 5px 6px; border-right: 1px solid #E0E0E0; background: #FFE1DC; color: #9A2E1E; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">P-111 (old)</span></div></div></div></div><div style="flex: 1 1 300px; padding: 18px; border-radius: 18px; background: var(--fix-bg); display: flex; flex-direction: column; gap: 12px"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.06em; color: var(--fix)">AFTER</span><div style="width: 420px; max-width: 100%"><div style="border-radius: 12px; overflow: hidden; background: #FFFFFF; color: #1C1D21; box-shadow: 0 24px 50px -24px rgba(0,0,0,0.45), 0 0 0 1px rgba(0,0,0,0.06); font-family: 'Inter', 'Helvetica Neue', Helvetica, sans-serif">
    <div style="display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #2F6B45; color: #FFF"><span style="width: 18px; height: 18px; border-radius: 4px; background: rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 11px">A</span><span style="font-size: 11px; font-weight: 600">Marina Heights</span><span style="margin-left: auto; font-size: 10px; opacity: 0.85">ADDA Admin</span></div>
    <div style="padding: 6px 12px; font-size: 10px; color: #6B6E76; border-bottom: 1px solid #E4E6EA">Approved Users › Unit 12</div>
    <div style="padding: 12px; font-size: 12px"><b style="font-size: 17px">Unit: 12</b><div style="margin-top: 6px; font-size: 11px"><div style="display: flex; justify-content: space-between; gap: 10px; padding: 3px 0"><span style="color: #6B6E76">Bill-To Name</span><span>Rahul Mehta</span></div><div style="display: flex; justify-content: space-between; gap: 10px; padding: 3px 0"><span style="color: #6B6E76">Sq.ft</span><span>1,240</span></div></div><div style="margin-top: 8px; padding: 10px 12px; border: 1px solid #3E9A66; border-radius: 10px; background: #EAF7EF"><b style="color: #2F6B45">Custom Information</b><div style="margin-top: 6px; display: flex; flex-direction: column; gap: 4px"><div style="display: flex; justify-content: space-between"><span>Swimming Pool</span><b>Yes</b></div><div style="display: flex; justify-content: space-between"><span>Roller Shutter</span><b>No</b></div><div style="display: flex; justify-content: space-between"><span>Parking slot numbers</span><b>P-104, P-105</b></div><div style="display: flex; justify-content: space-between"><span>Storage room reference</span><b>ST-22</b></div></div></div></div></div></div></div></div>
    </header>
    <section id="overview" style="scroll-margin-top: 24px; padding: 56px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 20px">
    <span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: var(--accent)">01 · OVERVIEW</span>
    <h2 style="margin: 0; font-size: clamp(28px, 3.4vw, 44px); font-weight: 600; letter-spacing: -0.03em; line-height: 1.08">A community ERP with a blind spot.</h2><p style="margin: 0; font-size: 17px; line-height: 1.6; color: var(--ink-2)">ADDA is a community-management ERP used by residential associations. Admins (Syndics) run units, owners, tenants, dues and reports in it. But every community also tracks things ADDA never asked for, a swimming pool, roller shutters, parking slots, a resident’s blood group. This project gave that data a home.</p><div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1px; border-radius: 16px; overflow: hidden; background: var(--line); border: 1px solid var(--line)"><div style="padding: 14px 16px; background: var(--surface); display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.06em; color: var(--muted)">PRODUCT</span><span style="font-size: 15px; font-weight: 600">ADDA ERP · Community Management</span></div><div style="padding: 14px 16px; background: var(--surface); display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.06em; color: var(--muted)">MY ROLE</span><span style="font-size: 15px; font-weight: 600">Senior Product Designer, end to end</span></div><div style="padding: 14px 16px; background: var(--surface); display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.06em; color: var(--muted)">WORKED WITH</span><span style="font-size: 15px; font-weight: 600">Product, web engineering &amp; QA</span></div><div style="padding: 14px 16px; background: var(--surface); display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.06em; color: var(--muted)">YEAR</span><span style="font-size: 15px; font-weight: 600">2026</span></div><div style="padding: 14px 16px; background: var(--surface); display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.06em; color: var(--muted)">PLATFORM</span><span style="font-size: 15px; font-weight: 600">ERP web (admin)</span></div><div style="padding: 14px 16px; background: var(--surface); display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.06em; color: var(--muted)">REGIONS</span><span style="font-size: 15px; font-weight: 600">India · UAE · Mauritius · US</span></div></div><div style="padding: 20px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); "><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.06em; color: var(--accent)">MY RESPONSIBILITIES</span><div style="height: 10px"></div><ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px"><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>Discovery with PM: PRD review, ARM parity audit, spreadsheet analysis</span></li><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>User stories, business rules and edge cases</span></li><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>Flows, wireframes and hi-fi UI in the ADDA system</span></li><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>Prototype reviews, dev handoff and design QA</span></li></ul></div></section>
    <section id="problem" style="scroll-margin-top: 24px; padding: 56px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 20px">
    <span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: var(--accent)">02 · PROBLEM</span>
    <h2 style="margin: 0; font-size: clamp(28px, 3.4vw, 44px); font-weight: 600; letter-spacing: -0.03em; line-height: 1.08">Communities have no way to capture community-specific data against a unit or a user inside ADDA.</h2><blockquote style="margin: 0; padding: 22px 26px; border-left: 4px solid var(--pain); background: var(--pain-bg); border-radius: 0 16px 16px 0; font-size: 22px; line-height: 1.45; letter-spacing: -0.01em">“A Syndic who needs to know which units have a swimming pool, a roller shutter or an assigned parking slot has to keep that list outside ADDA and reconcile it by hand.”</blockquote><p style="margin: 0; font-size: 17px; line-height: 1.6; color: var(--ink-2)">The data exists either way, it just lives in a private spreadsheet nobody else can see, search or trust. That costs admin time every day, and in an emergency it can cost far more.</p></section>
    <section id="pains" style="scroll-margin-top: 24px; padding: 56px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 20px">
    <span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: var(--accent)">03 · PAIN POINTS</span>
    <h2 style="margin: 0; font-size: clamp(28px, 3.4vw, 44px); font-weight: 600; letter-spacing: -0.03em; line-height: 1.08">Five frustrations, one root cause.</h2><div style="display: grid; grid-template-columns: 1fr; gap: 10px"><div style="display: flex; gap: 14px; padding: 16px 18px; border-radius: 16px; background: var(--pain-bg); border: 1px solid color-mix(in srgb, var(--pain) 35%, transparent)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; color: var(--pain); font-weight: 700">P1</span><span style="display: flex; flex-direction: column; gap: 4px"><b style="font-size: 16px">Data lives outside ADDA</b><span style="font-size: 14px; line-height: 1.5; color: var(--ink-2)">Unit and resident attributes sit in spreadsheets, so they can’t be referenced from the unit while the admin works.</span></span></div><div style="display: flex; gap: 14px; padding: 16px 18px; border-radius: 16px; background: var(--pain-bg); border: 1px solid color-mix(in srgb, var(--pain) 35%, transparent)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; color: var(--pain); font-weight: 700">P2</span><span style="display: flex; flex-direction: column; gap: 4px"><b style="font-size: 16px">Not searchable or reportable</b><span style="font-size: 14px; line-height: 1.5; color: var(--ink-2)">These attributes can’t be reported, searched or filtered anywhere in the product.</span></span></div><div style="display: flex; gap: 14px; padding: 16px 18px; border-radius: 16px; background: var(--pain-bg); border: 1px solid color-mix(in srgb, var(--pain) 35%, transparent)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; color: var(--pain); font-weight: 700">P3</span><span style="display: flex; flex-direction: column; gap: 4px"><b style="font-size: 16px">A known parity gap</b><span style="font-size: 14px; line-height: 1.5; color: var(--ink-2)">ACM has no Setup area under Units &amp; Users, ARM already does.</span></span></div><div style="display: flex; gap: 14px; padding: 16px 18px; border-radius: 16px; background: var(--pain-bg); border: 1px solid color-mix(in srgb, var(--pain) 35%, transparent)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; color: var(--pain); font-weight: 700">P4</span><span style="display: flex; flex-direction: column; gap: 4px"><b style="font-size: 16px">Data drifts and disappears</b><span style="font-size: 14px; line-height: 1.5; color: var(--ink-2)">Hand-kept records are lost when an admin changes; re-typed data drifts from the truth.</span></span></div><div style="display: flex; gap: 14px; padding: 16px 18px; border-radius: 16px; background: var(--pain-bg); border: 1px solid color-mix(in srgb, var(--pain) 35%, transparent)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; color: var(--pain); font-weight: 700">P5</span><span style="display: flex; flex-direction: column; gap: 4px"><b style="font-size: 16px">Missing in an emergency</b><span style="font-size: 14px; line-height: 1.5; color: var(--ink-2)">Resident data like blood group isn’t available when it’s urgently needed.</span></span></div></div></section>
    <section id="goals" style="scroll-margin-top: 24px; padding: 56px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 20px">
    <span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: var(--accent)">04 · GOALS</span>
    <h2 style="margin: 0; font-size: clamp(28px, 3.4vw, 44px); font-weight: 600; letter-spacing: -0.03em; line-height: 1.08">What success looks like.</h2><div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px"><div style="padding: 20px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); "><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.06em; color: var(--accent)">USER GOALS</span><div style="height: 10px"></div><ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px"><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>Record data on the unit or resident it belongs to</span></li><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>See it while working, no switching to a sheet</span></li><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>Pull the whole community’s data in one report</span></li></ul></div><div style="padding: 20px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); "><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.06em; color: var(--accent)">BUSINESS GOALS</span><div style="height: 10px"></div><ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px"><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>Close the ACM-vs-ARM capability gap</span></li><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>Lay
