  <!-- Styles -->
  <style>
body{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}

.theme-dark{--bg:#0B0B0C;--bg-rgb:11,11,12;--ink:#F2F1EC;--ink-rgb:242,241,236;--surface:#111113;--surface-2:#17171A;--muted:#A7A69F;--ink-2:#C9C8C1;--accent:#8F9BFF;--accent-rgb:143,155,255;--pain:#FF8C7A;--pain-bg:rgba(255,140,122,0.10);--fix:#3DD68C;--fix-bg:rgba(61,214,140,0.10);--line:rgba(242,241,236,0.12)}
.theme-light{--bg:#F4F3EF;--bg-rgb:244,243,239;--ink:#121212;--ink-rgb:18,18,18;--surface:#FFFFFF;--surface-2:#EAE9E4;--muted:#5E5D57;--ink-2:#3F3F3B;--accent:#2B3CFF;--accent-rgb:43,60,255;--pain:#C8372D;--pain-bg:rgba(200,55,45,0.07);--fix:#1E7A46;--fix-bg:rgba(30,122,70,0.08);--line:rgba(18,18,18,0.12)}

@media (max-width:900px){.toc{display:none !important}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
.lx-overlay{animation:lxfade .35s ease both}
.lx-card{animation:lxrise .5s cubic-bezier(.2,.8,.2,1) both}
.lx-bar{width:0;animation:lxbar 4.5s linear forwards}
@keyframes lxfade{from{opacity:0}to{opacity:1}}
@keyframes lxrise{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
@keyframes lxbar{from{width:0}to{width:100%}}
  </style>

    <h1 style="margin: 0; font-size: clamp(38px, 5vw, 72px); font-weight: 600; letter-spacing: -0.045em; line-height: 0.98">TTD CCC: Inspection Management Dashboard</h1>
    <p style="margin: 0; font-size: 21px; line-height: 1.45; color: var(--ink-2); max-width: 680px">Replacing a weekly spreadsheet review with a live, drill-down dashboard for TTD’s inspection teams.</p>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px"><div style="padding: 18px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--pain)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; color: var(--pain)">PROBLEM</span><p style="margin: 6px 0 0; font-size: 15px; line-height: 1.5">Inspection performance lived in a weekly, hand-made spreadsheet.</p></div><div style="padding: 18px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--fix)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; color: var(--fix)">SOLUTION</span><p style="margin: 6px 0 0; font-size: 15px; line-height: 1.5">A live CCC dashboard: unit coverage, performance, a ranked report and drill-down to photos.</p></div><div style="padding: 18px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--accent)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; color: var(--accent)">IMPACT</span><p style="margin: 6px 0 0; font-size: 15px; line-height: 1.5">Weekly → live · 100% of units accounted for · 4 clicks from number to photo.</p></div></div>
    <div style="padding: 20px; border-radius: 20px; background: linear-gradient(160deg, rgba(23,100,58,0.16), rgba(23,100,58,0.04))"><div style="width: 100%; border-radius: 12px; overflow: hidden; background: #EEF0F2; color: #1C1D21; font-family: 'Inter', 'Helvetica Neue', Helvetica, sans-serif; font-size: 11px; box-shadow: 0 24px 50px -26px rgba(0,0,0,0.45), 0 0 0 1px rgba(0,0,0,0.06)">
    <div style="display: flex; align-items: center; gap: 8px; padding: 9px 12px; background: #17643A; color: #FFF"><span style="width: 20px; height: 20px; border-radius: 5px; background: #F5D27A"></span><b style="font-size: 12px">TTD Service Management Dashboard</b><span style="margin-left: auto; padding: 3px 8px; border-radius: 6px; background: #FFF; color: #1C1D21; font-size: 10px">Hi, Ramesh Kumar ⌄</span></div>
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px; background: #FFF; border-bottom: 1px solid #E7E9EC"><span style="padding: 5px 10px; border-radius: 999px; background: #17643A; color: #FFF; font-size: 10px">Inspection Management</span><span style="padding: 5px 10px; border-radius: 999px; background: #F1F2F4; font-size: 10px">Defect Management</span><span style="margin-left: auto; font-size: 12px">⚙</span></div>
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 12px; background: #FFF"><span style="padding: 5px 8px; border: 1px solid #CDD0D6; border-radius: 6px; font-size: 10px">15 May 2026 – 20 Jun 2026 ▦</span><span style="padding: 5px 8px; border: 1px solid #CDD0D6; border-radius: 6px; font-size: 10px; color: #6B6E76">Select Department ⌄</span><span style="margin-left: auto; padding: 5px 9px; border: 1px solid #CDD0D6; border-radius: 6px; font-size: 10px">Download</span><span style="padding: 5px 9px; border-radius: 6px; background: #17643A; color: #FFF; font-size: 10px">Access Control</span></div><div style="padding: 10px; display: flex; flex-direction: column; gap: 10px"><div style="padding: 12px; border-radius: 10px; background: #FFF; display: flex; flex-direction: column; gap: 10px"><div style="display: flex; align-items: baseline; gap: 8px"><b style="font-size: 13px">Unit Inspection Status ⓘ</b><span style="font-size: 10px; color: #6B6E76">15 May – 20 Jun 2026</span><span style="margin-left: auto"><span style="padding: 3px 8px; border: 1px solid #E7E9EC; border-radius: 6px; font-size: 10px">Total Units: <b>356</b></span></span></div><div style="display: flex; height: 18px; border-radius: 5px; overflow: hidden"><span style="flex: 128; background: #2E7D32; color: #FFF; font-size: 10px; display: flex; align-items: center; justify-content: center">128</span><span style="flex: 60; background: #6CC08B; color: #FFF; font-size: 10px; display: flex; align-items: center; justify-content: center">60</span><span style="flex: 48; background: #F08C00; color: #FFF; font-size: 10px; display: flex; align-items: center; justify-content: center">48</span><span style="flex: 96; background: #E57373; color: #FFF; font-size: 10px; display: flex; align-items: center; justify-content: center">96</span><span style="flex: 24; background: #D32F2F; color: #FFF; font-size: 10px; display: flex; align-items: center; justify-content: center">24</span></div><div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px"><div style="padding-left: 8px; border-left: 3px solid #2E7D32"><div style="font-size: 10px; color: #6B6E76">Inspected ≤ 30 days ago</div><b style="font-size: 15px">128</b> <span style="font-size: 9px; color: #6B6E76">units (36.0%)</span></div><div style="padding-left: 8px; border-left: 3px solid #6CC08B"><div style="font-size: 10px; color: #6B6E76">Inspected 31–60 days ago</div><b style="font-size: 15px">60</b> <span style="font-size: 9px; color: #6B6E76">units (16.9%)</span></div><div style="padding-left: 8px; border-left: 3px solid #F08C00"><div style="font-size: 10px; color: #6B6E76">Inspected 61–90 days ago</div><b style="font-size: 15px">48</b> <span style="font-size: 9px; color: #6B6E76">units (13.5%)</span></div><div style="padding-left: 8px; border-left: 3px solid #E57373"><div style="font-size: 10px; color: #6B6E76">Inspected &gt; 90 days ago</div><b style="font-size: 15px">96</b> <span style="font-size: 9px; color: #6B6E76">units (27.0%)</span></div><div style="padding-left: 8px; border-left: 3px solid #D32F2F"><div style="font-size: 10px; color: #6B6E76">Never inspected</div><b style="font-size: 15px">24</b> <span style="font-size: 9px; color: #6B6E76">units (6.7%)</span></div></div><b style="font-size: 12px">Block Wise Breakdown</b><div style="overflow-x: auto"><div style="min-width: 520px"><div style="display: grid; grid-template-columns: 0.9fr 0.6fr 1fr 1fr 1fr 1fr 1fr; gap: 6px; padding: 7px 8px; background: #F4F5F7; border-radius: 6px; font-size: 10px; font-weight: 600; color: #6B6E76"><span>Blocks</span><span>Total</span><span>≤ 30 days</span><span>31–60</span><span>61–90</span><span>&gt; 90</span><span>Never</span></div><div style="display: grid; grid-template-columns: 0.9fr 0.6fr 1fr 1fr 1fr 1fr 1fr; gap: 6px; padding: 7px 8px; border-bottom: 1px solid #E7E9EC; font-size: 11px"><span>Ward 1</span><span>42</span><span>18 (42.9%)</span><span>8 (19.0%)</span><span>5 (11.9%)</span><span>7 (16.7%)</span><span><b style="color: #D32F2F">4 (9.5%)</b></span></div><div style="display: grid; grid-template-columns: 0.9fr 0.6fr 1fr 1fr 1fr 1fr 1fr; gap: 6px; padding: 7px 8px; border-bottom: 1px solid #E7E9EC; font-size: 11px"><span>Ward 2</span><span>58</span><span>22 (37.9%)</span><span>10 (17.2%)</span><span>7 (12.1%)</span><span>14 (24.1%)</span><span><b style="color: #D32F2F">5 (8.6%)</b></span></div><div style="display: grid; grid-template-columns: 0.9fr 0.6fr 1fr 1fr 1fr 1fr 1fr; gap: 6px; padding: 7px 8px; border-bottom: 1px solid #E7E9EC; font-size: 11px"><span>Ward 3</span><span>36</span><span>12 (33.3%)</span><span>6 (16.7%)</span><span>5 (13.9%)</span><span>10 (27.8%)</span><span><b style="color: #D32F2F">3 (8.3%)</b></span></div></div></div></div></div></div></div>
    </header>
    <section id="overview" style="padding: 52px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 18px">
    <span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: var(--accent)">01 · OVERVIEW</span><h2 style="margin: 0; font-size: clamp(28px, 3.4vw, 44px); font-weight: 600; letter-spacing: -0.03em; line-height: 1.08">Watching thousands of inspections, live.</h2>
    <div style="display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; background: rgba(var(--accent-rgb),0.08); border: 1px solid rgba(var(--accent-rgb),0.25)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; color: var(--accent); padding-top: 3px; white-space: nowrap">KEY TAKEAWAY</span><span style="font-size: 16px; font-weight: 600; line-height: 1.45">A live monitoring tab for inspections, built beside the helpdesk dashboard.</span></div>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1px; border-radius: 16px; overflow: hidden; background: var(--line); border: 1px solid var(--line)"><div style="padding: 14px 16px; background: var(--surface); display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.06em; color: var(--muted)">CLIENT</span><span style="font-size: 15px; font-weight: 600">Tirumala Tirupati Devasthanams (TTD)</span></div><div style="padding: 14px 16px; background: var(--surface); display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.06em; color: var(--muted)">PRODUCT</span><span style="font-size: 15px; font-weight: 600">ADDA ERP · CCC dashboard</span></div><div style="padding: 14px 16px; background: var(--surface); display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.06em; color: var(--muted)">MY ROLE</span><span style="font-size: 15px; font-weight: 600">Senior Product Designer</span></div><div style="padding: 14px 16px; background: var(--surface); display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.06em; color: var(--muted)">WORKED WITH</span><span style="font-size: 15px; font-weight: 600">Product, web engineering &amp; QA</span></div><div style="padding: 14px 16px; background: var(--surface); display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.06em; color: var(--muted)">YEAR</span><span style="font-size: 15px; font-weight: 600">2026</span></div><div style="padding: 14px 16px; background: var(--surface); display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.06em; color: var(--muted)">PLATFORM</span><span style="font-size: 15px; font-weight: 600">Web (desktop)</span></div></div><p style="margin: 0; font-size: 17px; line-height: 1.6; color: var(--ink-2)">TTD’s health and facility teams inspect hundreds of toilet units across zones and wards every day with the Nandakam app. CCC is where the Command &amp; Control Centre admins and TTD officials watch that work. This project added an Inspection Management tab next to the existing Defect Management dashboard.</p><div style="padding: 20px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); "><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.06em; color: var(--accent)">MY RESPONSIBILITIES</span><div style="height: 10px"></div><ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px"><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>Turned the functional spec’s data rules into clear widgets</span></li><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>Designed the dashboard, report, drill-down and inspection detail</span></li><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>Designed Department Setup, the department picker and exports</span></li><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>Handed off with edge cases and colour rules; ran design QA</span></li></ul></div></section><section id="problem" style="padding: 52px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 18px">
    <span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: var(--accent)">02 · PROBLEM</span><h2 style="margin: 0; font-size: clamp(28px, 3.4vw, 44px); font-weight: 600; letter-spacing: -0.03em; line-height: 1.08">Inspection performance was reviewed once a week, from a hand-compiled spreadsheet read out zone by zone.</h2>
    <div style="display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; background: rgba(var(--accent-rgb),0.08); border: 1px solid rgba(var(--accent-rgb),0.25)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; color: var(--accent); padding-top: 3px; white-space: nowrap">KEY TAKEAWAY</span><span style="font-size: 16px; font-weight: 600; line-height: 1.45">The data existed in ERP. The review still happened in a spreadsheet.</span></div>
    <blockquote style="margin: 0; padding: 20px 24px; border-left: 4px solid var(--pain); background: var(--pain-bg); border-radius: 0 16px 16px 0; font-size: 20px; line-height: 1.5">Allotment, Target, Achieved, %: typed up by hand and discussed in a weekly review meeting. Even after inspections moved into ERP and the app, there was still no single place to see target vs completed vs pending, find units nobody had inspected, or check the photos behind a number.</blockquote><p style="margin: 0; font-size: 17px; line-height: 1.6; color: var(--ink-2)">By the time a gap showed up in the weekly meeting, it was already a week old, and the evidence was sitting on someone else’s phone.</p><div style="display: flex; justify-content: center; padding: 26px; border-radius: 20px; background: var(--pain-bg)"><div style="width: 360px; max-width: 100%; border-radius: 8px; overflow: hidden; background: #FFF; color: #222; box-shadow: 0 24px 50px -24px rgba(0,0,0,0.5); font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px"><div style="padding: 7px 10px; background: #1E7A46; color: #FFF">weekly_review_FINAL.xlsx</div><div style="display: grid; grid-template-columns: repeat(5, 1fr); background: #F3F3F3; font-weight: 700"><span style="padding: 6px">Zone</span><span style="padding: 6px">Allot.</span><span style="padding: 6px">Target</span><span style="padding: 6px">Achieved</span><span style="padding: 6px">%</span></div><div style="display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid #E5E5E5"><span style="padding: 6px">Zone 1</span><span style="padding: 6px">18</span><span style="padding: 6px">480</span><span style="padding: 6px">391</span><span style="padding: 6px">81%</span></div><div style="display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid #E5E5E5"><span style="padding: 6px">Zone 2</span><span style="padding: 6px">16</span><span style="padding: 6px">480</span><span style="padding: 6px">328</span><span style="padding: 6px">68%</span></div><div style="display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid #E5E5E5"><span style="padding: 6px">Zone 3</span><span style="padding: 6px">9</span><span style="padding: 6px">240</span><span style="padding: 6px">240</span><span style="padding: 6px">100%</span></div><div style="padding: 7px 10px; background: #FFF7D6; font-size: 10px">Read out zone by zone, once a week ☕</div></div></div></section><section id="pains" style="padding: 52px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 18px">
    <span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: var(--accent)">03 · PAIN POINTS</span><h2 style="margin: 0; font-size: clamp(28px, 3.4vw, 44px); font-weight: 600; letter-spacing: -0.03em; line-height: 1.08">Five gaps from the spec.</h2>
    <div style="display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; background: rgba(var(--accent-rgb),0.08); border: 1px solid rgba(var(--accent-rgb),0.25)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; color: var(--accent); padding-top: 3px; white-space: nowrap">KEY TAKEAWAY</span><span style="font-size: 16px; font-weight: 600; line-height: 1.45">Five gaps: visibility, coverage, evidence, access and scale.</span></div>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px"><div style="display: flex; gap: 14px; padding: 16px 18px; border-radius: 16px; background: var(--pain-bg); border: 1px solid color-mix(in srgb, var(--pain) 35%, transparent)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; color: var(--pain); font-weight: 700">P1</span><span style="display: flex; flex-direction: column; gap: 4px"><b style="font-size: 16px">No centralised dashboard</b><span style="font-size: 14px; line-height: 1.5; color: var(--ink-2)">No single screen for Target vs Completed vs Pending across zones, wards or people, in real time.</span></span></div><div style="display: flex; gap: 14px; padding: 16px 18px; border-radius: 16px; background: var(--pain-bg); border: 1px solid color-mix(in srgb, var(--pain) 35%, transparent)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; color: var(--pain); font-weight: 700">P2</span><span style="display: flex; flex-direction: column; gap: 4px"><b style="font-size: 16px">No view of coverage gaps</b><span style="font-size: 14px; line-height: 1.5; color: var(--ink-2)">No way to see which toilet units were never inspected in a period.</span></span></div><div style="display: flex; gap: 14px; padding: 16px 18px; border-radius: 16px; background: var(--pain-bg); border: 1px solid color-mix(in srgb, var(--pain) 35%, transparent)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; color: var(--pain); font-weight: 700">P3</span><span style="display: flex; flex-direction: column; gap: 4px"><b style="font-size: 16px">No drill-down</b><span style="font-size: 14px; line-height: 1.5; color: var(--ink-2)">A person’s Achievement % couldn’t be traced back to inspections, checklist answers or photos.</span></span></div><div style="display: flex; gap: 14px; padding: 16px 18px; border-radius: 16px; background: var(--pain-bg); border: 1px solid color-mix(in srgb, var(--pain) 35%, transparent)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; color: var(--pain); font-weight: 700">P4</span><span style="display: flex; flex-direction: column; gap: 4px"><b style="font-size: 16px">No standard access control</b><span style="font-size: 14px; line-height: 1.5; color: var(--ink-2)">No consistent rule for who on the TTD / CCC side may view this operational data.</span></span></div><div style="display: flex; gap: 14px; padding: 16px 18px; border-radius: 16px; background: var(--pain-bg); border: 1px solid color-mix(in srgb, var(--pain) 35%, transparent)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; color: var(--pain); font-weight: 700">P5</span><span style="display: flex; flex-direction: column; gap: 4px"><b style="font-size: 16px">Stuck at one department</b><span style="font-size: 14px; line-height: 1.5; color: var(--ink-2)">No way to scope data as more TTD departments beyond Health join the platform.</span></span></div></div></section><section id="goals" style="padding: 52px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 18px">

var(--muted)">STORY 04</span><p style="margin: 0; font-size: 16px; line-height: 1.5">As <b>a CCC Admin</b>, I want to <b style="color: var(--accent)">drill into a person’s inspections and open the checklist with photos</b>, so that I can verify field work without visiting the site or borrowing a phone.</p></div><div style="padding: 18px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.06em; color: var(--muted)">STORY 05</span><p style="margin: 0; font-size: 16px; line-height: 1.5">As <b>a CCC Admin</b>, I want to <b style="color: var(--accent)">see unit-level inspections, including units never inspected</b>, so that I ensure full coverage, not just averages.</p></div><div style="padding: 18px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.06em; color: var(--muted)">STORY 06</span><p style="margin: 0; font-size: 16px; line-height: 1.5">As <b>the Support team</b>, I want to <b style="color: var(--accent)">set up departments and map communities to each</b>, so that new TTD departments can join the shared dashboard.</p></div></div></section><section id="users" style="padding: 52px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 18px">

s performance once access is granted.</p><ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px"><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>Needs a clear weekly picture</span></li><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>Shares PDFs with management</span></li></ul></div><div style="padding: 20px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); "><div style="display: flex; align-items: center; gap: 12px"><span style="width: 44px; height: 44px; border-radius: 50%; background: rgba(var(--accent-rgb),0.18); color: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px">S</span><span><b style="font-size: 16px">ADDA Support</b><br><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; color: var(--muted)">Support login</span></span></div><p style="margin: 12px 0; font-size: 14px; line-height: 1.5; color: var(--ink-2)">Sets up departments and maps communities.</p><ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px"><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>Needs safe, reversible setup</span></li><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>No double-mapped communities</span></li></ul></div></div></section><section id="research" style="padding: 52px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 18px">

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px"><div style="padding: 20px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); "><b style="font-size: 15px">Review-meeting audit</b><div style="margin-top: 6px; font-size: 13px; line-height: 1.5; color: var(--muted)">The Allotment / Target / Achieved / % spreadsheet</div></div><div style="padding: 20px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); "><b style="font-size: 15px">Functional spec workshops</b><div style="margin-top: 6px; font-size: 13px; line-height: 1.5; color: var(--muted)">Data rules for every card, with PM</div></div><div style="padding: 20px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); "><b style="font-size: 15px">Defect Management parity</b><div style="margin-top: 6px; font-size: 13px; line-height: 1.5; color: var(--muted)">Same access control, tabs and patterns</div></div><div style="padding: 20px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); "><b style="font-size: 15px">ERP config mapping</b><div style="margin-top: 6px; font-size: 13px; line-height: 1.5; color: var(--muted)">Zones, checklists, targets and shifts already in ERP</div></div></div><div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px"><div style="padding: 18px; border-radius: 16px; border-left: 3px solid var(--accent); background: var(--surface)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; color: var(--accent)">INSIGHT 1</span><div style="margin-top: 6px; font-size: 17px; font-weight: 600; line-height: 1.3">The meeting really asks “who’s behind?”</div><div style="margin-top: 6px; font-size: 14px; line-height: 1.5; color: var(--ink-2)">So the report sorts lowest achievers first, not alphabetically.</div></div><div style="padding: 18px; border-radius: 16px; border-left: 3px solid var(--accent); background: var(--surface)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; color: var(--accent)">INSIGHT 2</span><div style="margin-top: 6px; font-size: 17px; font-weight: 600; line-height: 1.3">Averages hide unvisited units</div><div style="margin-top: 6px; font-size: 14px; line-height: 1.5; color: var(--ink-2)">A 90% average can still leave units nobody has inspected for months.</div></div><div style="padding: 18px; border-radius: 16px; border-left: 3px solid var(--accent); background: var(--surface)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; color: var(--accent)">INSIGHT 3</span><div style="margin-top: 6px; font-size: 17px; font-weight: 600; line-height: 1.3">Trust needs evidence</div><div style="margin-top: 6px; font-size: 14px; line-height: 1.5; color: var(--ink-2)">A percentage only matters if you can open the checklist and photos behind it.</div></div><div style="padding: 18px; border-radius: 16px; border-left: 3px solid var(--accent); background: var(--surface)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; color: var(--accent)">INSIGHT 4</span><div style="margin-top: 6px; font-size: 17px; font-weight: 600; line-height: 1.3">Departments define scope</div><div style="margin-top: 6px; font-size: 14px; line-height: 1.5; color: var(--ink-2)">Officials think “Health” or “FMS”, not a list of ADDA communities.</div></div></div></section><section id="context" style="padding: 52px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 18px">
