<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Case study 02: ADDA Vendor Portal · Nikhil Satav</title>
  <meta name="description" content="ADDA Vendor Portal case study: vendors submit deliveries and invoices themselves, checked at entry and approved by the office.">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&amp;family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">

  <!-- Styles -->
  <style>
body{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.theme-dark{--bg:#0B0B0C;--bg-rgb:11,11,12;--ink:#F2F1EC;--ink-rgb:242,241,236;--surface:#111113;--surface-2:#17171A;--muted:#A7A69F;--ink-2:#C9C8C1;--accent:#8F9BFF;--accent-rgb:143,155,255;--pain:#FF8C7A;--pain-bg:rgba(255,140,122,0.10);--fix:#3DD68C;--fix-bg:rgba(61,214,140,0.10);--line:rgba(242,241,236,0.12)}
.theme-light{--bg:#F4F3EF;--bg-rgb:244,243,239;--ink:#121212;--ink-rgb:18,18,18;--surface:#FFFFFF;--surface-2:#EAE9E4;--muted:#5E5D57;--ink-2:#3F3F3B;--accent:#2B3CFF;--accent-rgb:43,60,255;--pain:#C8372D;--pain-bg:rgba(200,55,45,0.07);--fix:#1E7A46;--fix-bg:rgba(30,122,70,0.08);--line:rgba(18,18,18,0.12)}
.fade{animation:fade .45s ease both}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (max-width:900px){.toc{display:none !important}}@media (max-width:640px){.vp-nav{display:none !important}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
  </style>
</head>
<body>
  <!--
    The page is rendered from the <template> below by js/runtime.js.
    {{ ... }} bindings, <sc-if> and <sc-for> are resolved against js/case02-vendor-portal.js.
  -->
  <div id="app"></div>
  <template id="dc-template">
    <div class="{{themeClass}}" onScroll="{{onScroll}}" style="position: relative; height: 100vh; overflow-y: auto; overflow-x: hidden; background: var(--bg); color: var(--ink); font-family: 'Familjen Grotesk', 'Helvetica Neue', Helvetica, sans-serif; transition: background-color .3s, color .3s"><div style="position: sticky; top: 0; z-index: 15; height: 3px; background: var(--line)"><div style="height: 100%; width: {{pct}}%; background: var(--accent); transition: width .15s"></div></div>
    <div style="max-width: 1240px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 48px); display: flex; gap: 56px; align-items: flex-start">
    <aside class="toc" style="flex: 0 0 220px; position: sticky; top: 3px; padding: 32px 0; display: flex; flex-direction: column; gap: 2px">
    <a href="index.html#work" style="display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; min-height: 36px; padding: 0 14px; margin-bottom: 18px; border-radius: 999px; border: 1px solid var(--line); font-size: 13px; font-weight: 600; text-decoration: none; color: var(--ink)">← Back to portfolio</a><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; color: var(--muted); margin-bottom: 4px">CASE STUDY 02</span><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; color: var(--accent); margin-bottom: 12px">~{{minsLeft}} min left</span><sc-for list="{{toc}}" as="t" hint-placeholder-count="13"><button onClick="{{t.go}}" aria-current="{{t.on}}" style="text-align: left; display: flex; gap: 10px; align-items: center; padding: 7px 0 7px 12px; border-left: 2px solid {{t.bar}}; font-size: 14px; color: {{t.color}}; font-weight: {{t.weight}}; transition: color .2s"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; width: 18px; color: var(--muted)">{{t.mark}}</span>{{t.label}}</button></sc-for>
    <div style="margin-top: 18px"><button onClick="{{toggleTheme}}" aria-label="{{themeLabel}}" style="min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; color: var(--ink)">{{themeText}}</button></div></aside>
    <main style="flex: 1; min-width: 0; max-width: 860px; padding-bottom: 60px">
    <header style="padding: 64px 0 40px; display: flex; flex-direction: column; gap: 20px">
    <span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: var(--muted)">CASE STUDY 02 · ADDA · VENDOR PORTAL · 8 MIN READ</span>
    <h1 style="margin: 0; font-size: clamp(38px, 5vw, 72px); font-weight: 600; letter-spacing: -0.045em; line-height: 0.98">ADDA Vendor Portal: GR/SR &amp; Invoices</h1>
    <p style="margin: 0; font-size: 21px; line-height: 1.45; color: var(--ink-2); max-width: 680px">Letting vendors submit deliveries and invoices themselves, checked at the point of entry, approved by the office.</p>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px"><div style="padding: 18px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--pain)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; color: var(--pain)">PROBLEM</span><p style="margin: 6px 0 0; font-size: 15px; line-height: 1.5">The office re-keyed every vendor delivery and invoice, twice.</p></div><div style="padding: 18px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--fix)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; color: var(--fix)">SOLUTION</span><p style="margin: 6px 0 0; font-size: 15px; line-height: 1.5">A two-screen vendor portal: a dashboard that says what’s next, and POs that hold every GR/SR and invoice.</p></div><div style="padding: 18px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--accent)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; color: var(--accent)">IMPACT</span><p style="margin: 6px 0 0; font-size: 15px; line-height: 1.5">Typed once · quantity &amp; balance checked at entry · every submission kept as sent.</p></div></div>
    <div style="padding: 20px; border-radius: 20px; background: linear-gradient(160deg, rgba(16,104,72,0.18), rgba(16,104,72,0.04))"><figure style="margin: 0; border-radius: 12px; overflow: hidden; background: #FFF; box-shadow: 0 24px 50px -26px rgba(0,0,0,0.45), 0 0 0 1px rgba(0,0,0,0.08)"><div aria-hidden="true" style="display: flex; gap: 5px; padding: 7px 10px; background: #EEF0EE; border-bottom: 1px solid #E2E5E2"><span style="width: 8px; height: 8px; border-radius: 50%; background: #E2685B"></span><span style="width: 8px; height: 8px; border-radius: 50%; background: #E8B84A"></span><span style="width: 8px; height: 8px; border-radius: 50%; background: #5DBB63"></span></div><img src="assets/images/case02-vendor-portal-01.webp" alt="ADDA Vendor Portal dashboard" loading="lazy" style="display: block; width: 100%; height: auto"></figure></div>
    </header>
    <section id="overview" style="padding: 52px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 18px">
    <span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: var(--accent)">01 · OVERVIEW</span><h2 style="margin: 0; font-size: clamp(28px, 3.4vw, 44px); font-weight: 600; letter-spacing: -0.03em; line-height: 1.08">From re-keying to self-service.</h2>
    <div style="display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; background: rgba(var(--accent-rgb),0.08); border: 1px solid rgba(var(--accent-rgb),0.25)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; color: var(--accent); padding-top: 3px; white-space: nowrap">KEY TAKEAWAY</span><span style="font-size: 16px; font-weight: 600; line-height: 1.45">Vendors submit; admins approve. Each side keeps what it’s best at.</span></div>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1px; border-radius: 16px; overflow: hidden; background: var(--line); border: 1px solid var(--line)"><div style="padding: 14px 16px; background: var(--surface); display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.06em; color: var(--muted)">PRODUCT</span><span style="font-size: 15px; font-weight: 600">ADDA ERP · Expense Tracker + Vendor Portal</span></div><div style="padding: 14px 16px; background: var(--surface); display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.06em; color: var(--muted)">USERS</span><span style="font-size: 15px; font-weight: 600">Vendors, community admins, approvers</span></div><div style="padding: 14px 16px; background: var(--surface); display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.06em; color: var(--muted)">MY ROLE</span><span style="font-size: 15px; font-weight: 600">Senior Product Designer</span></div><div style="padding: 14px 16px; background: var(--surface); display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.06em; color: var(--muted)">WORKED WITH</span><span style="font-size: 15px; font-weight: 600">Product, web engineering &amp; QA</span></div><div style="padding: 14px 16px; background: var(--surface); display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.06em; color: var(--muted)">YEAR</span><span style="font-size: 15px; font-weight: 600">2026</span></div><div style="padding: 14px 16px; background: var(--surface); display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.06em; color: var(--muted)">PLATFORM</span><span style="font-size: 15px; font-weight: 600">Web (vendor portal + ERP)</span></div></div><p style="margin: 0; font-size: 17px; line-height: 1.6; color: var(--ink-2)">Communities buy from 100+ vendors per property. Every purchase runs PO → delivery (GR/SR) → invoice → payment inside ADDA’s Expense Tracker, but only the office could type it in. This project gave vendors their own portal to submit deliveries and invoices, while admins keep approvals, GL accounts and payments.</p><div style="padding: 20px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); "><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.06em; color: var(--accent)">MY RESPONSIBILITIES</span><div style="height: 10px"></div><ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px"><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>Designed both sides: the Vendor Portal and the ERP approval screens</span></li><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>Defined sign-in, validation and error copy with PM</span></li><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>Mapped multi-property accounts, invites and merges</span></li><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>Prototyped the end-to-end flow, handed off and ran design QA</span></li></ul></div></section><section id="problem" style="padding: 52px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 18px">
    <span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: var(--accent)">02 · PROBLEM</span><h2 style="margin: 0; font-size: clamp(28px, 3.4vw, 44px); font-weight: 600; letter-spacing: -0.03em; line-height: 1.08">The office re-keyed every vendor delivery and invoice into ADDA by hand.</h2>
    <div style="display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; background: rgba(var(--accent-rgb),0.08); border: 1px solid rgba(var(--accent-rgb),0.25)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; color: var(--accent); padding-top: 3px; white-space: nowrap">KEY TAKEAWAY</span><span style="font-size: 16px; font-weight: 600; line-height: 1.45">The vendor had the data. The office typed it, twice.</span></div>
    <blockquote style="margin: 0; padding: 20px 24px; border-left: 4px solid var(--pain); background: var(--pain-bg); border-radius: 0 16px 16px 0; font-size: 20px; line-height: 1.5">Vendors sent delivery notes and invoices by email or WhatsApp. Someone in the office typed each line into Expense Tracker, checked it against the PO balance by eye, then did it all again when the invoice arrived.</blockquote><p style="margin: 0; font-size: 17px; line-height: 1.6; color: var(--ink-2)">Double entry, missed balance checks, duplicate records, no trace of what the vendor actually sent, and a phone that kept ringing with “is it approved yet?”</p><div style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; padding: 24px; border-radius: 20px; background: var(--pain-bg); font-family: Inter, sans-serif; font-size: 12px; color: #1C1D21"><div style="width: 220px; padding: 10px 12px; border-radius: 12px; background: #DCF8C6; box-shadow: 0 10px 24px -14px rgba(0,0,0,0.5)"><span style="font-size: 10px; color: #6B6E76">WhatsApp · Al Safa Supplies</span><br>Delivered 8 floor cleaners today, invoice to follow 📎</div><div style="width: 220px; padding: 10px 12px; border-radius: 12px; background: #FFFFFF; box-shadow: 0 10px 24px -14px rgba(0,0,0,0.5)"><span style="font-size: 10px; color: #6B6E76">Email · Office</span><br>Retyping DN-4412 into Expense Tracker… is the PO balance enough?</div><div style="width: 220px; padding: 10px 12px; border-radius: 12px; background: #FFF5E6; box-shadow: 0 10px 24px -14px rgba(0,0,0,0.5)"><span style="font-size: 10px; color: #6B6E76">Call · Vendor</span><br>“Hi, is my GR approved yet? And why was the last one rejected?”</div></div></section><section id="pains" style="padding: 52px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 18px">
    <span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: var(--accent)">03 · PAIN POINTS</span><h2 style="margin: 0; font-size: clamp(28px, 3.4vw, 44px); font-weight: 600; letter-spacing: -0.03em; line-height: 1.08">Six pains from the FS.</h2>
    <div style="display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; background: rgba(var(--accent-rgb),0.08); border: 1px solid rgba(var(--accent-rgb),0.25)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; color: var(--accent); padding-top: 3px; white-space: nowrap">KEY TAKEAWAY</span><span style="font-size: 16px; font-weight: 600; line-height: 1.45">Six pains, all caused by one person typing for another.</span></div>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px"><div style="display: flex; gap: 14px; padding: 16px 18px; border-radius: 16px; background: var(--pain-bg); border: 1px solid color-mix(in srgb, var(--pain) 35%, transparent)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; color: var(--pain); font-weight: 700">P1</span><span style="display: flex; flex-direction: column; gap: 4px"><b style="font-size: 16px">Everything typed twice</b><span style="font-size: 14px; line-height: 1.5; color: var(--ink-2)">The office keyed the GR/SR, then keyed the invoice’s amounts, VAT and lines again.</span></span></div><div style="display: flex; gap: 14px; padding: 16px 18px; border-radius: 16px; background: var(--pain-bg); border: 1px solid color-mix(in srgb, var(--pain) 35%, transparent)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; color: var(--pain); font-weight: 700">P2</span><span style="display: flex; flex-direction: column; gap: 4px"><b style="font-size: 16px">No PO balance check</b><span style="font-size: 14px; line-height: 1.5; color: var(--ink-2)">Staff cross-checked amounts against the remaining PO balance by hand, easy to miss across 100+ vendors.</span></span></div><div style="display: flex; gap: 14px; padding: 16px 18px; border-radius: 16px; background: var(--pain-bg); border: 1px solid color-mix(in srgb, var(--pain) 35%, transparent)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; color: var(--pain); font-weight: 700">P3</span><span style="display: flex; flex-direction: column; gap: 4px"><b style="font-size: 16px">Audit gaps</b><span style="font-size: 14px; line-height: 1.5; color: var(--ink-2)">No record of what the vendor submitted, because admins created or edited entries for them.</span></span></div><div style="display: flex; gap: 14px; padding: 16px 18px; border-radius: 16px; background: var(--pain-bg); border: 1px solid color-mix(in srgb, var(--pain) 35%, transparent)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; color: var(--pain); font-weight: 700">P4</span><span style="display: flex; flex-direction: column; gap: 4px"><b style="font-size: 16px">Duplicates</b><span style="font-size: 14px; line-height: 1.5; color: var(--ink-2)">The same GR/SR or invoice could be raised twice, by the vendor and the admin.</span></span></div><div style="display: flex; gap: 14px; padding: 16px 18px; border-radius: 16px; background: var(--pain-bg); border: 1px solid color-mix(in srgb, var(--pain) 35%, transparent)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; color: var(--pain); font-weight: 700">P5</span><span style="display: flex; flex-direction: column; gap: 4px"><b style="font-size: 16px">Status follow-ups</b><span style="font-size: 14px; line-height: 1.5; color: var(--ink-2)">Vendors called to ask if a GR/SR was approved, why it was rejected, or if an invoice was paid.</span></span></div><div style="display: flex; gap: 14px; padding: 16px 18px; border-radius: 16px; background: var(--pain-bg); border: 1px solid color-mix(in srgb, var(--pain) 35%, transparent)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; color: var(--pain); font-weight: 700">P6</span><span style="display: flex; flex-direction: column; gap: 4px"><b style="font-size: 16px">Profile confirmations</b><span style="font-size: 14px; line-height: 1.5; color: var(--ink-2)">Vendors asked the office to confirm TRN, trade licence and bank details on file.</span></span></div></div></section><section id="goals" style="padding: 52px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 18px">
    <span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: var(--accent)">04 · GOALS</span><h2 style="margin: 0; font-size: clamp(28px, 3.4vw, 44px); font-weight: 600; letter-spacing: -0.03em; line-height: 1.08">What success looks like.</h2>
    <div style="display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; background: rgba(var(--accent-rgb),0.08); border: 1px solid rgba(var(--accent-rgb),0.25)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; color: var(--accent); padding-top: 3px; white-space: nowrap">KEY TAKEAWAY</span><span style="font-size: 16px; font-weight: 600; line-height: 1.45">Success = enter once, check instantly, approve the original.</span></div>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px"><div style="padding: 20px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); "><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.06em; color: var(--accent)">USER GOALS</span><div style="height: 10px"></div><ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px"><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>Vendors submit deliveries and invoices without the office</span></li><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>Know the next action and every status without calling</span></li><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>Never over-bill a PO by mistake</span></li></ul></div><div style="padding: 20px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); "><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.06em; color: var(--accent)">BUSINESS GOALS</span><div style="height: 10px"></div><ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px"><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>Validation at entry, not at approval</span></li><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>Admins keep approval, GL and payment authority</span></li><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"> ackground: var(--surface)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; color: var(--accent)">INSIGHT 2</span><div style="margin-top: 6px; font-size: 17px; font-weight: 600; line-height: 1.3">Check at entry, not at approval</div><div style="margin-top: 6px; font-size: 14px; line-height: 1.5; color: var(--ink-2)">Quantity and balance errors are cheapest to stop while typing.</div></div><div style="padding: 18px; border-radius: 16px; border-left: 3px solid var(--accent); background: var(--surface)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; color: var(--accent)">INSIGHT 3</span><div style="margin-top: 6px; font-size: 17px; font-weight: 600; line-height: 1.3">Approvers need the original</div><div style="margin-top: 6px; font-size: 14px; line-height: 1.5; color: var(--ink-2)">Admins can approve or reject, but never edit what was sent.</div></div><div style="padding: 18px; border-radius: 16px; border-left: 3px solid var(--accent); background: var(--surface)"><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; color: var(--accent)">INSIGHT 4</span><div style="margin-top: 6px; font-size: 17px; font-weight: 600; line-height: 1.3">Status visibility ends the calls</div><div style="margin-top: 6px; font-size: 14px; line-height: 1.5; color: var(--ink-2)">Every record shows its stage, approver and rejection reason.</div></div></div></section><section id="context" style="padding: 52px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 18px">

pan style="color: var(--accent)">→</span><span>One Primary Email ID = one portal account, many properties</span></li><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>Sign-in code valid 5 minutes, 3 attempts</span></li><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>Qty ≤ PO quantity minus earlier non-rejected GR/SRs</span></li><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>GR/SR total ≤ remaining PO balance</span></li><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>One pending GR/SR per PO at a time</span></li><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2)"><span style="color: var(--accent)">→</span><span>Invoice number unique per vendor per property</span></li></ul></div></div></section><section id="challenges" style="padding: 52px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 18px">
